<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ถ้าโลกแตกอีก 365 วัน จะทำอะไรก่อนโลกแตก</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;700&family=Silkscreen&display=swap">
<style>
/* layout: HUD on top, pixel screen left, story card right; stacks on phones. Single dark look by choice (night-sky arcade). */
:root{
  --bg:#120a1f; --bg2:#1a1030; --panel:#21143d; --panel2:#2e1c55; --line:#4d3487;
  --gold:#3de0c8; --gold2:#a6fff0; --text:#f5f0ff; --muted:#b8a8e0; --dim:#8070b0;
  --good:#62d6a4; --bad:#ff7d7d;
  --hp:#ff5c7c; --md:#f4cd4e; --lv:#ff8ad8; --ht:#ff8a3d; --mo:#e8b25a; --fd:#e8a24a; --wt:#4ab8ff; --en:#9aff6a; --wd:#ff4a4a; --inf:#b8ff4a;
  --f-d:'Mitr','Sarabun','Noto Sans Thai',sans-serif;
  --f-b:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
  --f-n:'Silkscreen','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{
  background:var(--bg); color:var(--text); font-family:var(--f-b); font-size:16px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 28px;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.app{max-width:1240px;margin:0 auto;display:grid;gap:14px}

/* HUD */
.hud{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--gold);padding:10px 16px 12px;display:grid;gap:8px}
.hud-line{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--gold2)}
.hud-line b{font-weight:500}
.hud-main{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.who .nm{font-family:var(--f-d);font-size:22px;color:var(--gold2);line-height:1.2}
.who .rl{color:var(--muted);font-size:14px}
.stats{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.st{display:flex;align-items:center;gap:6px;font-family:var(--f-n);font-size:12px}
.st .bar{width:54px;height:6px;background:#0c0618;border:1px solid var(--line);position:relative}
.st .bar i{position:absolute;inset:0 auto 0 0;display:block}
.st .v{min-width:2ch;text-align:right}
.st.money{font-size:13px;color:var(--mo)}
.ic{display:inline-block;width:14px;height:14px;background-size:contain;background-repeat:no-repeat;image-rendering:pixelated;flex:none}

/* Stage */
.stage{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.screen{display:grid;gap:10px;min-width:0}
.cwrap{position:relative;border:3px solid var(--gold);background:#000;box-shadow:0 0 0 1px #000,0 6px 0 #05081280}
#cv{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges}
.count{position:absolute;left:8px;top:8px;background:#0c0618d9;border:1px solid var(--line);padding:3px 8px;font-family:var(--f-n);font-size:12px;color:var(--gold2);display:flex;gap:6px;align-items:center}
.count em{font-style:normal;color:var(--bad)}
.floaters{position:absolute;left:8px;top:40px;display:grid;gap:4px;pointer-events:none}
.fl{background:#0c0618e6;border:1px solid var(--line);padding:2px 8px 2px 6px;font-family:var(--f-n);font-size:12px;display:flex;align-items:center;gap:6px;animation:fl 2.2s ease-out forwards}
.fl.up{color:var(--good)} .fl.dn{color:var(--bad)}
@keyframes fl{0%{opacity:0;transform:translateY(8px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.tl{padding:4px 2px 0}
.tl .track{height:6px;background:#0c0618;border:1px solid var(--line);position:relative}
.tl .fill{position:absolute;inset:0 auto 0 0;background:var(--gold);width:0}
.tl .thumb{position:absolute;top:-5px;width:12px;height:16px;background:var(--gold2);border:2px solid #000;margin-left:-6px;left:0}
.tl .ticks{display:flex;justify-content:space-between;font-family:var(--f-n);font-size:10px;color:var(--dim);margin-top:6px}
.ctrls{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ctrls small{color:var(--dim);font-size:13px}
.ctrls .bt{display:flex;gap:8px;flex-wrap:wrap}
.mini{background:var(--bg2);border:1px solid var(--line);color:var(--gold2);padding:6px 14px;font-size:14px}
.mini:hover{background:var(--panel2)}
.mini[aria-pressed="true"]{border-color:var(--gold);background:var(--panel2)}

/* Card */
.card{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--gold);padding:18px 18px 20px;display:grid;gap:14px;min-width:0}
.kick{font-size:13px;color:var(--gold);display:flex;gap:8px;flex-wrap:wrap}
.kick span+span::before{content:'·';margin-right:8px;color:var(--dim)}
.amb{border-left:3px solid var(--gold);background:#1a1030;padding:10px 14px;color:var(--text);font-size:15px}
.card h2{font-family:var(--f-d);font-weight:500;font-size:26px;line-height:1.3;margin:0;color:var(--text);text-wrap:balance}
.card p{margin:0}
.sub{color:var(--muted);font-size:16.5px}
.choices{display:grid;gap:10px}
.ch{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--line);padding:10px 14px 10px 10px;transition:transform .08s,border-color .12s}
.ch:hover:not(:disabled){border-color:var(--gold);transform:translateX(2px)}
.ch:disabled{opacity:.45;cursor:not-allowed}
.ch .n{font-family:var(--f-n);font-size:11px;color:var(--dim);padding-top:4px}
.ch .t{font-weight:700;font-size:16.5px;line-height:1.35}
.chips{display:flex;gap:6px 10px;flex-wrap:wrap;margin-top:5px;font-family:var(--f-n);font-size:11px}
.chip{display:inline-flex;gap:4px;align-items:center}
.chip.up{color:var(--good)} .chip.dn{color:var(--bad)} .chip.neu{color:var(--gold2)} .chip.rk{color:var(--ht);font-weight:700}
.chip.txt{font-family:var(--f-b);font-size:12.5px}
.chip.rk{margin-left:auto;text-align:right}
.btn{background:var(--gold);color:#06211d;border:0;border-bottom:3px solid #1c8f80;padding:11px 22px;font-family:var(--f-d);font-weight:500;font-size:17px}
.btn:hover{background:var(--gold2)}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel2)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.res{font-size:17px;line-height:1.7}
.res.bad{color:#ffd2d2}
.big{font-family:var(--f-d);font-size:34px;line-height:1.2;color:var(--gold2);margin:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.fact{background:var(--bg2);border:1px solid var(--line);padding:8px 10px}
.fact small{display:block;color:var(--dim);font-size:12px}
.fact b{font-family:var(--f-d);font-weight:500;font-size:17px}
.tlist{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:14.5px}
.tlist li{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;color:var(--muted)}
.tlist li b{font-family:var(--f-n);font-weight:400;font-size:11px;color:var(--gold);padding-top:3px}
.tlist li.f span{color:var(--bad)}
.hint{color:var(--dim);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);padding:8px 16px;font-size:14px;z-index:20}

/* v2: survival, info, actions, chat, lobby */
.stats.r2{gap:10px 14px}
.stats .sep{flex-basis:100%;height:0}
.tag{font-family:var(--f-b);font-size:12px;border:1px solid var(--line);padding:1px 8px;color:var(--muted);background:var(--bg2)}
.tag.bad{color:var(--bad);border-color:#6a2a3a}
.tag.mood{color:var(--gold2)}
.info{background:var(--panel);border:1px solid var(--line);padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;font-size:13.5px}
.info h4{margin:0 0 4px;font-family:var(--f-d);font-weight:500;font-size:13px;color:var(--gold)}
.info .it{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.info .it b{font-family:var(--f-n);font-weight:400;font-size:12px;color:var(--text)}
.info .mb{height:5px;background:#0c0618;border:1px solid var(--line);margin:3px 0 5px}
.info .mb i{display:block;height:100%}
.info .jr{grid-column:1/-1;color:var(--muted);font-size:13px;display:grid;gap:3px}
.info .jr span b{font-family:var(--f-n);font-weight:400;font-size:10.5px;color:var(--gold);margin-right:6px}
.agrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.act{background:var(--panel2);border:1px solid var(--line);border-top:2px solid var(--line);padding:9px 8px 8px;text-align:center;display:grid;gap:3px;align-content:start;position:relative}
.act:hover:not(:disabled){border-color:var(--gold);transform:translateY(-1px)}
.act:disabled{opacity:.4;cursor:not-allowed}
.act b{font-family:var(--f-d);font-weight:500;font-size:15px;line-height:1.25}
.act small{color:var(--dim);font-size:12px;line-height:1.3}
.act .en{font-family:var(--f-n);font-size:10.5px;color:var(--en)}
.act.hot{border-top-color:var(--bad);box-shadow:0 0 0 1px #ff7d7d44}
.btn.urge{background:var(--bad);border-bottom-color:#9a3a3a;color:#2a0808}
.vb{position:absolute;right:6px;top:4px;font-family:var(--f-n);font-size:10.5px;color:var(--gold2);background:#0c0618;border:1px solid var(--line);padding:0 5px}
.ch{position:relative}
.ch.voted{border-color:var(--gold);background:#3b2570}
.ch .vb{top:6px}
.chat{background:var(--panel);border:1px solid var(--line);padding:10px 12px;display:grid;gap:8px}
.chat h4{margin:0;font-family:var(--f-d);font-weight:500;font-size:13px;color:var(--gold);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chat h4 span{font-family:var(--f-b);font-weight:400;color:var(--muted);font-size:12px}
.clog{height:130px;overflow:auto;display:grid;align-content:start;gap:3px;font-size:14px;background:var(--bg2);border:1px solid var(--line);padding:6px 8px}
.clog p{margin:0;overflow-wrap:anywhere}
.clog b{color:var(--gold2);font-weight:500;margin-right:6px}
.clog .sys{color:var(--dim);font-size:12.5px}
.crow{display:flex;gap:8px}
.crow input{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line);color:var(--text);padding:8px 10px;font:inherit;font-size:15px}
.crow input:focus-visible{outline:2px solid var(--gold2);outline-offset:1px}
.fld{display:grid;gap:4px}
.fld label{font-size:13px;color:var(--muted)}
.fld input{background:var(--bg2);border:1px solid var(--line);color:var(--text);padding:9px 12px;font:inherit;font-size:17px}
.code{font-family:var(--f-n);font-size:34px;letter-spacing:.12em;color:var(--gold2);background:var(--bg2);border:1px dashed var(--gold);padding:8px 14px;text-align:center;user-select:all}
.plist{display:flex;gap:6px;flex-wrap:wrap}
.plist span{background:var(--bg2);border:1px solid var(--line);padding:2px 10px;font-size:14px}
.tomb{border:2px solid #8a8f98;background:#1d1238;padding:14px 16px;text-align:center;display:grid;gap:4px}
.tomb b{font-family:var(--f-d);font-weight:500;font-size:20px}
.tomb em{font-style:normal;color:var(--muted)}
.act3{display:grid;gap:6px}
.act3 h4{margin:6px 0 0;font-family:var(--f-d);font-weight:500;font-size:14px;color:var(--gold)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.chk input{width:18px;height:18px;accent-color:var(--gold)}

@media (max-width:900px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .hud-main{align-items:flex-start}
  .stats{gap:10px 14px}
  .screen,.side{display:contents!important}
  .stage{gap:12px}
  .cwrap{order:1;width:100%}
  .card .row,.ovb .row{flex-direction:row-reverse;justify-content:flex-start}.minv{order:2}.card{order:3}.chat{order:4}.mtog{order:5}.info{order:6}.ctrls{order:7}
  .tl{display:none}
  .btn,.mini,.act,.ch{min-height:44px}
  .hud{padding:6px 10px 8px;gap:4px}
  .hud-line{font-size:11px}#hr{display:none}
  .who .rl{display:none}.who .nm{font-size:18px}
  .stats{gap:3px 10px}.st{font-size:11px}.st .bar{width:34px}.st.money{font-size:12px}
  .card{padding:9px 10px 11px;gap:7px}.card h2{font-size:17px;line-height:1.25}
  .card p{font-size:14px;line-height:1.5}.amb{font-size:13px;padding:7px 10px}
  .card .kick{font-size:11px;gap:4px 6px}.tag{font-size:11px;padding:1px 6px}
  .choices{gap:6px}.ch{padding:6px 8px 6px 6px;gap:6px;grid-template-columns:14px minmax(0,1fr);min-height:0}
  .ch .t{font-size:14px;line-height:1.3}.chips{margin-top:3px;font-size:10.5px;gap:3px 8px}.chip.txt{font-size:11px}
  .res{font-size:14.5px;line-height:1.5}.sub{font-size:14px}
  .btn{padding:9px 16px;font-size:15px}.act{padding:6px}.act small{font-size:11px}
  .shopi{padding:6px 8px;gap:6px}
  .info,.ctrls{display:none!important}
  body.mopen .info{display:grid!important}body.mopen .ctrls{display:block!important}
  .mtog{display:block!important}
  .minv{display:flex!important}
}
.mtog,.minv{display:none}
.mtog{width:100%;background:var(--panel2);border:1px solid var(--line);padding:10px;font-size:14px;color:var(--gold2);text-align:center}
.minv{gap:6px 12px;flex-wrap:wrap;justify-content:center;font-size:13px;background:var(--panel);border:1px solid var(--line);padding:6px 8px;color:var(--text)}
@media (prefers-reduced-motion:reduce){.fl{animation-duration:.01s}.ch{transition:none}}
.ovb .row{flex-direction:row-reverse;justify-content:flex-start}
@media (min-width:901px) and (min-height:640px) and (max-height:800px){.cwrap{width:min(100%,calc((100vh - 420px)*1.7778))!important}}
@media (min-width:901px) and (min-height:640px){
  html,body{height:100%;overflow:hidden}
  body{padding-block:8px 8px}
  .app{height:calc(100vh - 16px);grid-template-rows:auto minmax(0,1fr);gap:10px}
  .stage{min-height:0;height:100%;align-items:stretch}
  .screen{display:flex;flex-direction:column;gap:8px;min-height:0}
  .cwrap{flex:none;width:min(100%,calc((100vh - 335px)*1.7778));align-self:center}
  .tl{flex:none}
  .info{flex:1 1 auto;min-height:0;overflow:auto;padding:8px 12px}
  .ctrls{flex:none}
  .side{height:100%;min-height:0!important;grid-template-rows:minmax(0,1fr) auto!important}
  #panel{overflow:auto;min-height:0;align-content:start}
  .info{align-content:start;flex:0 1 auto}
  .hud{padding:6px 14px 8px;gap:4px}.stats .sep{display:none}.hud-main{gap:8px}
  .card{padding:10px 16px 12px;gap:8px}.card h2{font-size:21px}.card p{font-size:14.5px;line-height:1.5}
  .choices{gap:6px}.ch{padding:6px 12px 6px 8px}.ch .t{font-size:15px}.chips{margin-top:3px}
  .amb{padding:7px 12px;font-size:13.5px}
  .ctrls .bt{gap:5px}.ctrls .mini{padding:3px 9px;font-size:13px}.ctrls small{display:none}
  .tl .ticks{font-size:9px}
}

.ov{position:fixed;inset:0;background:rgba(4,7,18,.78);display:grid;place-items:center;z-index:50;padding:16px}
.ovb{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--gold);max-width:520px;width:100%;max-height:86vh;overflow:auto;padding:14px 18px 18px;display:grid;gap:8px}
.ovh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:18px;color:var(--gold2)}
.ovb h4{margin:8px 0 0;color:var(--gold2);font-weight:500;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:4px}
.lg{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.lg .ic{flex:none;margin-top:2px}
.lg small{display:block;color:var(--muted);font-size:13px}
.shop{display:grid;gap:6px}
.shopi{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);padding:8px 12px}
.shopi small{display:block;color:var(--muted);font-size:13px}
.shopi .pr{font-family:var(--f-n);color:var(--gold2);font-size:14px}
.mini:disabled{opacity:.45;cursor:not-allowed}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:46vh;overflow:auto}
.rank li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--line);padding:6px 10px;font-size:14px}
.rank li.me{border-color:var(--gold);background:var(--panel2)}
.rank small{display:block;color:var(--muted);font-size:12px}
.gn{color:var(--good,#5fd08a)!important;font-size:11px!important}.showg{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:4px;flex-basis:100%}
.rank em{font-style:normal;color:var(--gold2);font-family:var(--f-n)}
#onl{display:none;gap:6px;border:1px solid var(--line);background:var(--bg2);padding:10px 12px}
#onl h4{margin:0;font-weight:500;font-size:14px;color:var(--gold2);display:flex;justify-content:space-between}
.olist{display:grid;gap:4px;max-height:150px;overflow:auto}
.op{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.op small{display:block;color:var(--muted);font-size:12px}
.gi{padding:3px 0;border-top:1px dashed var(--line)}.gi b{font-size:13px}.gi small{display:block;color:var(--muted);font-size:12px}
.need{flex-basis:100%;background:#c0392b22;border:1px solid var(--bad,#c0392b);color:var(--bad,#c0392b);padding:5px 9px;font-size:13px;border-radius:6px;font-weight:700}
.diff{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0 2px}.diff label{font-size:14px;color:var(--muted)}.diff .mini.on{background:var(--gold);color:var(--bink);border-color:var(--gold)}.diff small{flex-basis:100%;color:var(--muted);font-size:12px}
.nick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.nick input{background:var(--bg2);border:1px solid var(--line);color:var(--text);padding:6px 10px;font:inherit;width:170px}

body{background:radial-gradient(900px 500px at 85% -10%,#4a1f7a55,transparent 70%),radial-gradient(800px 500px at -10% 110%,#0f5c6a44,transparent 70%),var(--bg)}
.card h2.hero,.hero{font-family:var(--f-d);font-weight:600;line-height:1.2;background:linear-gradient(90deg,#a6fff0,#ff9ae0 55%,#ffd98a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.card{box-shadow:0 0 0 1px #00000066,0 10px 40px #1c0a3a99}
.btn{box-shadow:0 0 18px #3de0c855}
.fact{border-top:2px solid var(--gold)}
.fact:nth-child(2){border-top-color:#ff9ae0}.fact:nth-child(3){border-top-color:#ffd98a}.fact:nth-child(4){border-top-color:#9a8cff}
.cwrap{box-shadow:0 0 0 1px #000,0 0 28px #7a3dff55}
.shopi.tix{border-color:#ffd98a;background:linear-gradient(90deg,#3b2a0f,#1d1238)}
.shopi.tix.diamond{border-color:#7ae7ff;background:linear-gradient(90deg,#0f3b4a,#1d1238)}
.shopi.tix.demon{border-color:#ff5c7c;background:linear-gradient(90deg,#4a0f23,#1d1238)}
.vrow{display:grid;grid-template-columns:90px 1fr 40px;gap:10px;align-items:center;font-size:14px}
.vrow input[type=range]{width:100%;accent-color:var(--gold)}

<script>/* ===== ตัวเชื่อมออนไลน์สำหรับเปิดนอก claude.ai: ห้อง/ล็อบบี้/อันดับ ผ่านโบรกเกอร์ MQTT สาธารณะ (ไม่ต้องมีเซิร์ฟเวอร์ของเรา) ===== */
(function(){
if(window.claude&&window.claude.use)return;
window.D365_SA=true;
const BROKERS=window.D365_BROKERS||['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const NS='d365v1/';
const enc=new TextEncoder(),dec=new TextDecoder();
const cat=(...ps)=>{let n=0;ps.forEach(p=>n+=p.length);const o=new Uint8Array(n);let i=0;ps.forEach(p=>{o.set(p,i);i+=p.length});return o};
const lenB=n=>{const a=[];do{let b=n%128;n=Math.floor(n/128);if(n>0)b|=128;a.push(b)}while(n>0);return Uint8Array.from(a)};
const u16=n=>Uint8Array.from([n>>8,n&255]);
const strB=s=>{const b=enc.encode(s);return cat(u16(b.length),b)};
const pkt=(h,body)=>cat(Uint8Array.from([h]),lenB(body.length),body);
const rid=()=>Math.random().toString(36).slice(2,10);

function Mqtt(opts){
  const S={ws:null,ready:false,buf:new Uint8Array(0),subs:[],bi:0,closed:false,ping:null,retry:0,pid:1,timer:null};
  const cid='d365-'+rid();
  function connect(){
    if(S.closed)return;
    const url=BROKERS[S.bi%BROKERS.length];
    let ws;try{ws=new WebSocket(url,'mqtt')}catch(e){again();return}
    ws.binaryType='arraybuffer';S.ws=ws;S.buf=new Uint8Array(0);
    ws.onopen=()=>{
      const will=opts.will?cat(strB(opts.will.topic),strB(opts.will.payload)):new Uint8Array(0);
      const vh=cat(strB('MQTT'),Uint8Array.from([4,opts.will?0x06:0x02]),u16(30));
      ws.send(pkt(0x10,cat(vh,strB(cid),will)));
    };
    ws.onmessage=ev=>{
      S.buf=cat(S.buf,new Uint8Array(ev.data));
      let buf=S.buf;
      for(;;){
        if(buf.length<2)break;
        let i=1,mul=1,len=0,b;
        do{if(i>=buf.length){b=-1;break}b=buf[i++];len+=(b&127)*mul;mul*=128}while(b&128);
        if(b===-1||buf.length<i+len)break;
        const t=buf[0]>>4,fl=buf[0]&15,body=buf.subarray(i,i+len);
        try{handle(t,fl,body)}catch(e){}
        buf=buf.subarray(i+len);
      }

  }
  const api={
    subscribe(f){if(!S.subs.includes(f))S.subs.push(f);if(S.ready)sendSub(f)},
    publish(topic,payload,retain){

}

const rooms=new Map();
function makeRoom(name){
  name=String(name||'lobby');
  if(rooms.has(name))return rooms.get(name);
  const base=NS+'r/'+name.replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,40)+'/';
  const emitT=base+'e',presT=base+'p',me=rid();
  let pres={},peers=new Map(),handlers={},cbs=[],conn=[],last='',dead=false;
  const clean=o=>{try{const s=JSON.stringify(o);if(s.length>2000)return {};const p=JSON.parse(s);return p&&typeof p==='object'&&!Array.isArray(p)?p:{}}catch(e){return {}}};
  const mk=(id,p)=>({peer:id,sameTab:id===me,isMe:id===me,kind:'viewer',presence:p});
  const list=()=>[mk(me,pres)].concat([...peers.entries()].map(([id,v])=>mk(id,v.p)));
  const fire=(j,l,u)=>{const ch={joined:j,left:l,updated:u,peers:list()};cbs.slice().forEach(f=>{try{f(ch)}catch(e){}})};
  const mq=Mqtt({
    will:{topic:presT,payload:JSON.stringify({f:me,bye:1})},
    onOpen(){mq.subscribe(emitT);mq.subscribe(presT);sendPres(true);conn.forEach(f=>{try{f(true)}catch(e){}})},
    onClose(){conn.forEach(f=>{try{f(false)}catch(e){}})},
    onMsg(topic,str){
      if(dead||str.length>12000)return;
      let d;try{d=JSON.parse(str)}catch(e){return}
      if(!d||typeof d!=='object'||typeof d.f!=='string'||d.f===me||d.f.length>20)return;
      if(topic===presT){
        if(d.bye){const v=peers.get(d.f);if(v){peers.delete(d.f);fire([],[mk(d.f,v.p)],[])}return}
        const p=clean(d.p),had=peers.get(d.f);
        peers.set(d.f,{p,seen:Date.now()});
        if(!had)fire([mk(d.f,p)],[],[]);
        else if(JSON.stringify(had.p)!==JSON.stringify(p))fire([],[],[mk(d.f,p)]);
        if(d.hi)setTimeout(()=>sendPres(false),Math.random()*900);
      }else if(topic===emitT){
        if(typeof d.t!=='string')return;
        if(d.to&&d.to!==me)return;
        if(!peers.has(d.f)){peers.set(d.f,{p:{},seen:Date.now()});fire([mk(d.f,{})],[],[])}
        else peers.get(d.f).seen=Date.now();
        (handlers[d.t]||[]).slice().forEach(fn=>{try{fn({peer:d.f,sameTab:false,isMe:false,kind:'viewer',data:d.d})}catch(e){}});
      }
    }
  });
  function sendPres(hi){if(!dead)mq.publish(presT,JSON.stringify({f:me,p:pres,hi:hi?1:0}))}
  const hb=setInterval(()=>{
    sendPres(false);
    const now=Date.now(),gone=[];
    for(const [id,v] of peers)if(now-v.seen>16000)gone.push(id);
    gone.forEach(id=>{const v=peers.get(id);peers.delete(id);fire([],[mk(id,v.p)],[])});
  },4000);
  const R={
    name,
    emit(topic,data){
      if(dead)return Promise.reject(new Error('left'));
      const s=JSON.stringify({f:me,t:String(topic),d:data===undefined?null:data});
      if(s.length>12000)return Promise.reject(new Error('too_big'));
      if(!mq.publish(emitT,s))return Promise.reject(new Error('offline'));
      Promise.resolve().then(()=>(handlers[topic]||[]).slice().forEach(fn=>{try{fn({peer:me,sameTab:true,isMe:true,kind:'viewer',data})}catch(e){}}));
      return Promise.resolve();
    },
    on(topic,fn){(handlers[topic]=handlers[topic]||[]).push(fn);return()=>{handlers[topic]=(handlers[topic]||[]).filter(x=>x!==fn)}},
    presence(patch){
      const np=Object.assign({},pres);
      for(const k in (patch||{})){if(patch[k]===null)delete np[k];else np[k]=patch[k]}
      pres=clean(np);const s=JSON.stringify(pres);
      if(s!==last){last=s;sendPres(false);fire([],[],[mk(me,pres)])}
      return Promise.resolve();
    },
    peers:()=>list(),
    onPeers(fn){cbs.push(fn);setTimeout(()=>{try{fn({joined:list(),left:[],updated:[],peers:list()})}catch(e){}},0);return()=>{cbs=cbs.filter(x=>x!==fn)}},
    connected:()=>mq.ready,
    onConnection(fn){conn.push(fn);return()=>{conn=conn.filter(x=>x!==fn)}},
    leave(){
      if(dead)return Promise.resolve();
      try{mq.publish(presT,JSON.stringify({f:me,bye:1}))}catch(e){}
      dead=true;clearInterval(hb);mq.close();rooms.delete(name);handlers={};cbs=[];
      return Promise.resolve();
    }
  };

}

const DBT=NS+'db/';

function makeDb(){
  const cache=new Map(),subs=new Set(),watchers=[];let tm=null;
  const mq=Mqtt({onMsg(topic,str){
    if(!topic.startsWith(DBT)||str.length>12000)return;
    const path=topic.slice(DBT.length);
    let d=null;try{d=str?JSON.parse(str):null}catch(e){return}
    if(d&&typeof d==='object'&&!Array.isArray(d))cache.set(path,d);else cache.delete(path);
    clearTimeout(tm);tm=setTimeout(notify,250);
  }});
  const sub=f=>{if(!subs.has(f)){subs.add(f);mq.subscribe(DBT+f)}};
  function snap(c){const docs=[];for(const [p,d] of cache)if(p.startsWith(c+'/')&&p.indexOf('/',c.length+1)<0)docs.push({id:p.slice(c.length+1),data:()=>d});return {docs}}
  function notify(){watchers.forEach(w=>{try{w.cb(snap(w.c))}catch(e){}})}
  const wait=(path)=>new Promise(res=>{const t0=Date.now();(function chk(){if(cache.has(path)||Date.now()-t0>2500)res();else setTimeout(chk,150)})()});
  return {
    doc(path){return {
      async get(){sub(path);await wait(path);const d=cache.get(path);return {exists:!!d,data:()=>d}},
      async set(d){
        const s=JSON.stringify(d);if(s.length>12000)throw new Error('too_big');
        let n=0;while(!mq.publish(DBT+path,s,true)&&n++<20)await new Promise(r=>setTimeout(r,300));
        if(n>=20)throw new Error('offline');cache.set(path,d);clearTimeout(tm);tm=setTimeout(notify,100);
      },
      async update(d){const cur=cache.get(path)||{};return this.set(Object.assign({},cur,d))}
    }},
    collection(c){return {limit(){return this},onSnapshot(cb){sub(c+'/+');const w={c,cb};watchers.push(w);setTimeout(()=>{try{cb(snap(c))}catch(e){}},1800);return()=>{const i=watchers.indexOf(w);if(i>=0)watchers.splice(i,1)}}}}
  };
}

    const want=[];
    if((S.tag.crime||0)>=2)want.push(RND()<.7?'vil':'evil');
    if((S.tag.help||0)>=3)want.push(RND()<.5?'saint':'good');
    for(const al of want){
      const alt=EXTRA.filter(e=>(e.al===al||(al==='vil'&&e.al==='evil')||(al==='saint'&&e.al==='good'))&&(e.cats.includes('*')||e.cats.includes(cat))&&(!e.show||e.show(S))&&!out.includes(e));
      if(alt.length&&out.length){out[out.length-1]=alt[rnd(alt.length)]}else if(alt.length&&n>0){out.push(alt[rnd(alt.length)])}

};

function karTitle(k){k=k|0;for(const t of KAR_T)if(k>=t[0])return t;return KAR_T[KAR_T.length-1]}
function karmaGain(tag,ok,al,o){
  if(!S)return;
  let d=0;
  if(tag==='crime')d=ok?-5:-3;else if(tag==='help')d=ok?3:1;else if(tag==='faith')d=1;else if(tag==='love')d=ok?1:0;
  if(!d)return;
  if(al==='vil'||al==='saint')d=Math.round(d*1.8);
  const before=karTitle(S.kar|0)[1];
  S.kar=Math.max(-100,Math.min(100,(S.kar|0)+d));
  const t=karTitle(S.kar);
  if(t[1]!==before&&o&&o.extra)o.extra.push('<b>ชื่อเสียงของคุณเปลี่ยนไป</b> ผู้คนเริ่มมองคุณเป็น "'+t[1]+'"');
}
function karChip(k){

function afThemeOf(t){
  if(t.arc)return null;
  if(t.rare)return 'rare';
  if(/^c_[a-z]+2$/.test(t.k||''))return 'story';
  if(t.dis){const k=t.k||'';let th='calam';
    if(/quake|titan|kaiju|dino|giant|foot|sinkh/.test(k))th='quake';
    else if(/flood|tsunami|wave|dam|mud|whale|drown/.test(k))th='water';
    else if(/fire|volcano|lava|heat|meteor/.test(k))th='fire';
    else if(/gods|lightning|storm|tornado|sky|thunder|eclipse/.test(k))th='thunder';
    else if(/alien|rift|robot|astro|moon/.test(k))th='alien';
    else if(/zomb|vamp|wraith|ghost|haunt|bats|spider/.test(k))th='undead';
    else if(/tree|maneater|locust/.test(k))th='tree';
    else if(/chem|acid|plague|fog/.test(k))th='gas';
    else if(/dragon|monster|wolf/.test(k))th='demon';
    return th}
  return null;
}

const AF_SEQ={3:['end'],4:['ep3','end'],5:['ep3','ep4','end']};
function afterStart(t,e){
  if(S.after||S.arcPlan&&S.arcPlan.n>0&&S.arcPlan.n<5)return;
  if((S.afCount|0)>=3||S.day<(S.afCool|0))return;
  const th=afThemeOf(t);if(!th)return;
  const chain=th==='story';
  const p=th==='rare'?.6:th==='story'?1:.4;
  if(RND()>=p)return;
  const total=rr(3,5);
  const nm=th==='story'?(CHAIN_N[(/^(c_[a-z]+)/.exec(t.k)||[])[1]]||'เรื่องต่อเนื่อง'):(th==='rare'?String(e.head||'เหตุการณ์หายาก').slice(0,26):(DIS_N[t.k]||DIS_N_X[t.k]||'มหันตภัย'));
  const base=chain?2:1;
  const seq=chain?AF_SEQ[total].slice():['ep2'].concat(AF_SEQ[total]);
  S.after={th,nm,ic:AF_TH[th].ic,base,total,seq,i:0,at:S.day+rr(4,8)};
  S.afCount=(S.afCount|0)+1;
  if(e.tag)e.tag=Object.assign({},e.tag,{s:(e.tag.s||'')+' · ตอนที่ '+base+' จาก '+total});
}
function afterTick(){
  const a=S.after;if(!a)return null;
  if(S.day>=345){S.after=null;return null}
  if(S.day<a.at)return null;
  if(S.arcPlan&&S.arcPlan.n>0&&S.arcPlan.n<5){a.at=S.day+3;return null}
  const type=a.seq[a.i];if(!type){S.after=null;return null}
  a.i++;
  const scene=a.base+a.i;
  const tpl=afEp({th:a.th,nm:a.nm,ic:a.ic,n:scene,total:a.total},type==='end'?'end':type);
  tpl.ep=scene;tpl.len=a.total;
  if(a.i>=a.seq.length){S.after=null;S.afCool=S.day+10}else a.at=S.day+rr(4,8);
  return tpl;
}

['ยานแม่และการตัดสินใจสุดท้าย','ยานขนาดใหญ่เท่าภูเขาปรากฏเหนือเมือง ผู้นำของพวกมันส่งภาพเข้าหัวคุณโดยตรงว่าพวกเขาจะ "ทดสอบ" มนุษยชาติครั้งสุดท้าย ถ้าผ่านได้ พวกเขาจะจากไป ถ้าไม่ผ่าน เมืองนี้จะหายไป',[

gods:[

 ['ยืนตรงและมองหน้าเขา',{md:3,ht:4,en:-8},.45,'เขายกมือ แสงสีทองกดทับคุณจนเข่าอ่อนทรุดลงไปเอง',{hp:-12,md:-10,wd:6},'เขาจ้องคุณนานและยิ้มบางๆ ก่อนจะหันไปหาคนต่อไป',{g:'adv'}],

['พายุสายฟ้าลงโทษคนบาป','พระอาทิตย์ตกแล้วท้องฟ้ากลายเป็นสีทองและดำ สายฟ้าฟาดลงมาทีละเส้นตรงจุดที่มีคนยืนอยู่ ทุกคนวิ่งหลบเข้าบ้านเรือนวัดวาและตึกสูง ต้องผ่านคืนนี้ให้ได้',[

['รุ่งเช้าของคำตัดสินสุดท้าย','พระอาทิตย์ขึ้นและเทพองค์เดิมปรากฏขึ้นกลางท้องฟ้า เขาส่งสายตาลงมาที่ผู้คนที่ยังเหลืออยู่ และบอกว่าเขาจะตัดสินว่ามนุษย์สมควรได้รับโอกาสอีกครั้งหรือไม่ ตามสิ่งที่ทุกคนทำเมื่อคืนนี้',[

 ['อยู่เงียบๆ ในที่ของตัวเองและภาวนาในใจ',{md:-2,en:-8},.42,'แสงสีทองส่องมาที่คุณโดยตรงและทุกคนหันมองคุณพร้อมกัน',{hp:-12,md:-12,wd:6},'ความเงียบของคุณกลายเป็นเสียงเดียวที่ไม่ขัดแย้งกับใคร และเทพปล่อยคุณผ่านไป',{fin:1}],

tree:[
['ดอกสีแดงบานข้ามคืนทั้งตำบล','เช้านี้ดอกไม้สีแดงขนาดเท่าจานข้าวบานอยู่ทั่วทุ่ง ข้างถนน และบนหลังคาโรงเรียน กลิ่นหวานจางๆ ลอยมาตามลม และสุนัขหลายตัวที่เดินเข้าไปดมกลายเป็นเงียบไปหมด',[

['เถาวัลย์เลื้อยเข้าหมู่บ้าน','ตอนเช้ามีรอยเถาวัลย์ขนาดเท่าแขนเลื้อยข้ามถนนหน้าตลาดอย่างช้าๆ คนที่ถูกเถารัดจะหยุดนิ่งและเดินตามมันไปเหมือนถูกสะกด',[

['คนในแก๊งเริ่มหายไป','ตลอดสัปดาห์มีลูกน้องหายไปสองคนโดยไม่บอกลา เมื่อคืนมีคนเห็นเงาใครบางคนในแก๊งไปคุยกับตำรวจที่หน้าสถานี บรรยากาศในถิ่นตึงเครียดจนไม่มีใครกล้าหลับ',[
 ['เรียกทุกคนมาถามต่อหน้า ใครทรยศต้องรับ',{md:-3,en:-10,lv:-3},.3,'ไม่มีใครยอมรับ และการกล่าวหากันทำให้ทะเลาะจนบางคนเดินออกไป',{md:-8,lv:-6},'ลูกน้องคนหนึ่งสารภาพทั้งน้ำตา เขาถูกข่มขู่ให้เป็นสายให้ตำรวจ คุณเลือกให้โอกาส',{n:1,flag:{gz:0}}],
 ['ย้ายถิ่นทั้งแก๊งตอนกลางคืนโดยไม่บอกใคร',{en:-16,md:-2,food:-1},.35,'ย้ายไม่ทันเพราะมีคนแอบส่งข่าว ตำรวจดักรอที่ปลายซอยใหม่',{hp:-8,ht:20,md:-8},'ถิ่นใหม่ใต้สะพานเงียบและปลอดภัยกว่าเดิม ตำรวจที่ตามมาพบแต่ที่ว่างเปล่า',{g:'crime'}],
 ['ใช้เงินปิดปากตำรวจที่มาตามเรื่อง',{mo:-3500,ht:-18,md:-3},.3,'ตำรวจรับเงินไปแล้วยังจับลูกน้องของคุณไปหนึ่งคน',{mo:-3500,md:-8,ht:10},'ตำรวจรับซองแล้วหันหลังเดินไป คุณได้เวลาหายใจอีกหนึ่งอาทิตย์',{g:'crime',flag:{gz:0}}],
 ['ปล่อยแก๊งแตกไป อยู่กับคนที่ยังเชื่อใจได้ก็พอ',{md:2,lv:3,en:-4},.12,'คนที่เหลือรู้สึกเหมือนถูกทิ้งและด่าคุณกลางถนน',{md:-8,lv:-4},'เหลือกันแค่ไม่กี่คน แต่คืนนั้นคุณหลับสนิทเป็นครั้งแรกในรอบสัปดาห์',{flag:{gz:-2}}]]],
['ศึกชิงถนนสายสุดท้าย','แก๊งใหญ่ที่สุดในเมืองส่งข่าวมาว่าเหลือถนนสายเดียวที่ยังไม่มีเจ้าของ ใครชนะคืนนี้จะได้ครอบครองจนถึงวันสุดท้ายของโลก ผู้คนในย่านเงียบเชียบ ปิดประตูหน้าต่างทุกบาน',[
 ['นำทุกคนบุกก่อนที่พวกมันจะตั้งหลัก',{md:6,lv:3,en:-26,ht:12},.5,'คุณถูกล้อมจากสามด้านและโดนไม้ฟาดเข้าที่หลังจนล้มลง',{hp:-22,wd:26,md:-12,ht:14},'ศึกจบลงที่เช้ามืด คุณยืนอยู่บนถนนที่เป็นของคุณ ลูกน้องที่เหลือคุกเข่าทักทาย “หัวหน้า”',{g:'crime',flag:{gw:2,gz:1,gend:1}}],
 ['เจรจาแบ่งเขตกับหัวหน้าอีกฝ่ายต่อหน้าชาวบ้าน',{md:4,lv:3,en:-12},.3,'การเจรจาล่มเมื่อลูกน้องฝ่ายตรงข้ามขว้างขวดใส่ และทุกอย่างลุกเป็นไฟ',{hp:-14,wd:16,md:-10},'ถนนถูกแบ่งครึ่ง ชาวบ้านเปิดหน้าต่างออกมาดูอย่างไม่เชื่อสายตา',{n:1,flag:{gw:1,gend:1}}],
 ['ชวนชาวบ้านมายืนเป็นกำแพงมนุษย์ไม่ให้ใครสู้กัน',{lv:6,md:5,en:-16,ht:-6},.35,'ชาวบ้านครึ่งหนึ่งกลัวจนไม่มา และคุณยืนอยู่หน้าแก๊งคู่อริเพียงลำพัง',{hp:-14,wd:16,md:-8},'ผู้คนออกมายืนเรียงกันเต็มถนน ทั้งสองแก๊งชะงักก่อนเก็บอาวุธลงทีละคน',{g:'help',flag:{gw:1,gend:2}}],
 ['ยุบแก๊ง แล้วเดินออกจากถนนสายนั้นไปคนเดียว',{md:4,lv:-3,en:-8},.15,'ลูกน้องที่เหลือด่าคุณเป็นคนขี้ขลาดทั้งที่น้ำตายังไหล',{md:-8,lv:-6},'คุณเดินออกมาโดยไม่เหลียวหลัง ข้างหลังเสียงตะโกนค่อยๆ เบาลงจนเหลือแต่ลม',{flag:{gend:3,gz:-3}}]]]
],
help:[
['เปิดครัวชุมชนหน้าซอย','กลุ่ม “{G}” เริ่มจากหม้อข้าวต้มใบเดียวหน้าซอย แต่ทันทีที่กลิ่นลอยออกไป คนหิวโหยก็ต่อแถวกันยาวถึงปากทาง ของในหม้อเหลือไม่ถึงครึ่งของคนที่มา',[
 ['แบ่งข้าวต้มให้ทุกคนคนละน้อย ให้ได้กินกันทั่วถึง',{food:-2,lv:6,md:6,en:-12},.15,'ข้าวหมดก่อนที่แถวจะหมด และคนท้ายแถวโวยวายใส่คุณ',{md:-6,lv:-2},'ทุกคนได้กินคนละถ้วย ไม่ใช่เต็มอิ่มแต่ไม่มีใครกลับไปมือเปล่า',{g:'help',flag:{gz:1}}],
 ['ออกไปขอข้าวสารจากร้านค้าแถวนั้นมาเพิ่ม',{food:2,md:2,en:-12},.3,'เจ้าของร้านด่าว่าคุณเป็นขอทานและไล่ออกมาจากหน้าร้านต่อหน้าลูกค้า',{md:-7,lv:-2},'เจ้าของร้านถอนหายใจแล้วยกกระสอบข้าวสารมาวางให้ “เอาไปเถอะ เก็บไว้ก็ไม่ได้ใช้”',{g:'help'}],
 ['ให้เฉพาะเด็กกับคนแก่ก่อน',{lv:4,md:4,en:-8},.2,'คนวัยทำงานที่อดมาหลายวันโกรธและแย่งหม้อข้าวจนหกกระจาย',{md:-8,hp:-5},'เด็กๆ กินข้าวต้มพลางยิ้ม คนแก่ยกมือไหว้คุณทั้งที่น้ำตาไหล',{g:'help',flag:{gz:1}}],
 ['เก็บข้าวไว้ให้กลุ่มตัวเองก่อน เพราะเรายังต้องอยู่รอด',{food:1,md:-4,lv:-4},.1,'คนต่อแถวเห็นแล้วโกรธ ทุบหม้อข้าวจนแตก',{food:-1,md:-8,hp:-4},'กลุ่มของคุณกินอิ่ม แต่ทุกคนไม่มีใครกล้าสบตาคนที่ยังยืนอยู่ในแถว',{g:'crime',flag:{gz:-1}}]]],
['แก๊งมาแย่งครัว','คืนหนึ่งชายสี่คนถือไม้เดินเข้ามาที่ครัวชุมชน ตะโกนว่าถนนสายนี้เป็นของ “แก๊งมัจจุราช” ทุกอย่างในหม้อ ในกระสอบ ต้องส่งให้พวกเขา ชาวบ้านที่มาต่อแถวถอยหลังกันเป็นแถว',[
 ['ยืนขวางหน้าหม้อข้าว ไม่ให้ใครแตะต้อง',{md:4,lv:3,en:-18},.45,'หัวหน้าแก๊งผลักคุณล้มและเตะหม้อข้าวพลิกคว่ำ',{hp:-14,wd:18,md:-10,food:-1},'พวกเขาจ้องคุณนาน ก่อนเดินออกไปโดยไม่รู้ว่าทำไมถึงไม่กล้าแตะ',{g:'help',flag:{gz:1,gw:1}}],
 ['ชวนทุกคนในแถวมารวมตัวกันเป็นกลุ่มใหญ่',{lv:6,md:5,en:-14},.3,'ชาวบ้านส่วนใหญ่กลัวจนวิ่งหนี เหลือคุณกับสองสามคนเผชิญหน้ากับพวกมัน',{hp:-10,wd:12,md:-8},'ชาวบ้านทุกคนเดินเข้ามายืนเรียงข้างหลังคุณ เสียงฝีเท้ารวมกันดังกว่าเสียงขู่ของแก๊ง',{g:'help',flag:{gz:2,gw:1}}],
 ['ยอมให้ข้าวสารส่วนหนึ่งเพื่อให้พวกเขาไป',{food:-2,mo:-1000,md:-4},.18,'พวกเขาเอาข้าวสารไปแล้วกลับมาอีกคืนถัดมา',{md:-8,food:-1},'พวกเขาเอาของไปและไม่กลับมาอีก ชาวบ้านมองคุณด้วยสายตาปนความขอบคุณและผิดหวัง',{}],
 ['แจ้งตำรวจให้มาจับกุม',{ht:-4,md:2,en:-6},.35,'ตำรวจไม่มา และแก๊งรู้ว่าใครแจ้ง',{hp:-10,wd:12,md:-8},'ตำรวจสองนายมาถึงพอดี แก๊งถอยไปโดยไม่ต่อสู้',{flag:{gw:1}}]]],
['ศูนย์พยาบาลชั่วคราว','เมื่อคืนมีเหตุวุ่นวายในย่าน ผู้บาดเจ็บถูกพามานอนเรียงอยู่ในครัวชุมชนเต็มพื้น เสียงร้องปนเสียงขอน้ำ ยาที่มีกองอยู่แค่ในลังเล็กๆ ลังเดียว',[
 ['ใช้ยาที่เหลือรักษาคนที่อาการหนักที่สุดก่อน',{med:-2,lv:5,md:4,en:-14},.3,'ผู้ป่วยที่คุณเลือกไม่รอด และครอบครัวของอีกคนด่าว่าคุณเลือกผิด',{md:-12,lv:-3},'อาการของคนไข้ดีขึ้นจนลืมตา ญาติร้องไห้จนเข่าอ่อน',{g:'help',flag:{gz:1}}],
 ['แบ่งยาทุกคนเท่าๆ กันแม้จะไม่พอ',{med:-2,md:3,lv:3,en:-10},.4,'ยาที่แบ่งไม่พอกับใครเลย แผลหลายคนอักเสบหนักขึ้น',{md:-10,wd:8,inf:6},'การดูแลทั่วถึงทำให้ทุกคนอยู่รอดข้ามคืนนั้น เช้ามาแผลทุกคนเริ่มแห้ง',{g:'help'}],
 ['ออกไปหาของที่ร้านขายยาร้างข้างทาง',{med:2,en:-18,md:2},.42,'ร้านยามีคนอื่นรออยู่ก่อน และคุณโดนผลักล้มบนเศษแก้ว',{hp:-12,wd:14,md:-8},'หลังชั้นยาที่ตกแตก คุณพบกล่องยาแก้อักเสบที่ยังซีลอยู่',{g:'help',flag:{gz:0}}],
 ['ขอให้หมอที่รู้จักมาช่วยแม้เขาจะปฏิเสธมาหลายครั้ง',{mo:-1500,lv:2,md:2,en:-10},.3,'หมอปฏิเสธอีกครั้งอย่างเย็นชา คุณกลับมาเจอแต่เสียงครวญคราง',{md:-9},'หมอมาถึงพร้อมกระเป๋าใบเก่าและเริ่มทำงานโดยไม่พูดอะไรสักคำ',{g:'help',flag:{gz:1}}]]],
['เสบียงหายไปจากคลัง','คุณนับกระสอบข้าวสารสามรอบก็ได้ผลเหมือนเดิม หายไปสี่กระสอบ และไม่มีรอยงัดแงะ แปลว่าคนทำคือคนในกลุ่ม “{G}” เอง ทุกคนดูเหนื่อยและกลัวเกินกว่าจะบอกอะไร',[
 ['ประชุมทั้งกลุ่ม ให้คนทำยอมรับเอง',{md:-2,en:-8,lv:-2},.3,'ไม่มีใครพูดและบรรยากาศร้าวฉานจนบางคนเก็บของออกไป',{md:-8,lv:-5},'หญิงคนหนึ่งยอมรับทั้งน้ำตา เธอเอาไปให้ลูกที่ป่วย กลุ่มลงมติให้อภัย',{g:'help',flag:{gz:0}}],
 ['แอบสังเกตการณ์ตอนกลางคืนจนจับได้',{en:-14,md:-3},.35,'คุณหลับไปและตื่นมาเจอคลังโล่งกว่าเดิม',{food:-2,md:-8},'คุณเห็นชายคนหนึ่งแอบขนข้าวไปขายตลาดมืด และตามไปจนเห็นเงินในมือเขา',{g:'crime',flag:{gw:1}}],
 ['ไม่เอาเรื่อง ให้ทุกคนเอาไปได้ตามที่จำเป็น',{food:-2,lv:4,md:3},.18,'ของหมดเร็วกว่าที่คิดและไม่เหลือให้คนที่ต้องการจริงๆ',{md:-6,food:-2},'ความไว้ใจในกลุ่มเพิ่มขึ้น ไม่มีใครแอบเอาของอีกเลยตลอดสัปดาห์นั้น',{g:'help',flag:{gz:1}}],
 ['จัดยามกะกลางคืนและล็อกคลังด้วยโซ่',{en:-10,md:-2},.15,'ยามหลับ และโซ่ถูกตัดตอนเช้ามืด',{food:-1,md:-5},'การจัดระเบียบทำให้ของไม่หายอีก แม้บรรยากาศจะตึงเครียดขึ้นเล็กน้อย',{flag:{gw:1}}]]],
['คืนที่ทุกคนมาปกป้องศูนย์','ข่าวเรื่องศูนย์ของ “{G}” แพร่ไปทั่วเมือง คืนนี้กลุ่มคนติดอาวุธกว่าสามสิบคนบุกเข้ามาในย่าน พวกเขาต้องการเสบียงและเตรียมใช้กำลังทุกอย่าง แต่ทุกคนที่คุณช่วยเหลือมาตลอดก็ยืนอยู่ข้างหลังคุณ',[
 ['ยืนหน้าสุดและเรียกทุกคนมาล้อมศูนย์ไว้',{md:6,lv:6,en:-24},.5,'คุณโดนกระแทกจนล้มลง แต่ชาวบ้านทุกคนไม่ยอมถอยแม้ก้าวเดียว',{hp:-20,wd:24,md:-10},'ฝูงชนที่คุณเคยช่วยเหลือรวมกันเป็นกำแพง ผู้บุกรุกค่อยๆ ถอยกลับไปทีละก้าว',{g:'help',flag:{gw:2,gz:1,gend:1}}],
 ['เปิดศูนย์ให้เข้ามาเอาเสบียงตามต้องการแต่ไม่ทำร้ายใคร',{food:-3,water:-2,md:4,lv:4},.3,'พวกเขาไม่ฟัง เอาของแล้วยังทุบศูนย์เสียหายหนัก',{hp:-12,wd:14,md:-8,food:-2},'ผู้บุกรุกยืนนิ่งเมื่อเห็นคนป่วยนอนเต็ม ก่อนวางอาวุธลงและช่วยกันขนข้าว',{g:'help',flag:{gw:1,gend:2}}],
 ['พาคนป่วยและเด็กหนีออกทางหลังทั้งหมด',{md:-3,en:-18,lv:3},.35,'ทางหลังถูกปิด และคุณต้องแบกเด็กวิ่งข้ามหลังคาในความมืด',{hp:-12,wd:14,md:-8},'ทุกคนรอดออกไปได้พร้อมกัน แม้ศูนย์จะถูกทิ้งไว้ข้างหลัง',{g:'help',flag:{gend:3}}],
 ['ชวนผู้นำของฝ่ายนั้นมานั่งคุยกันกลางศูนย์',{md:4,lv:3,en:-12},.35,'ผู้นำปฏิเสธและสั่งลูกน้องลุยเข้ามา',{hp:-16,wd:18,md:-10},'ผู้นำนั่งลง ดื่มน้ำจากแก้วที่คุณยื่น แล้วรู้ว่าทุกคนที่นี่ไม่ใช่ศัตรู',{g:'help',flag:{gw:2,gend:1}}]]]

function rivalFill(e,t){
  if(!S.rival||!t||!t.rv)return;
  const R=S.rival.n;const f=s=>typeof s==='string'?s.split('{R}').join(R):s;
  e.head=f(e.head);e.txt=f(e.txt);
  for(const c of e.ch)for(const k of ['t','r','f'])c[k]=f(c[k]);
}

function rivalTick(){
  if(!S.rival)return null;
  if(S.rivAt===undefined)S.rivAt=rr(25,90);
  const n=S.flags.rv|0;
  if(n>=3||S.day<S.rivAt||S.day>=345)return null;
  const t=TPL.find(x=>x.k==='rv_'+S.rival.rel+(n+1));
  if(!t)return null;
  S.rivAt=S.day+rr(35,65);S.flags.rv=n+1;
  return t;
}

for(const f of FEST){
  const ev=FEV[f.k];
  T({k:'fest_'+f.k,sc:f.sc,w:1,cd:5,req:()=>false,head:ev[0],txt:ev[1],ch:ev[2].map(c=>Object.assign({},c)),fest:f.k});
  KEYMOOD['fest_'+f.k]=f.w==='calm'?'calm':f.w;KEYCAT['fest_'+f.k]='joy';
}
function festivalTick(){
  if(S.cal0==null)return null;
  S.fest=S.fest||{};
  for(const f of FEST){
    if(S.fest[f.k])continue;
    const off=((f.doy-S.cal0)%365+365)%365;
    if(S.day>=off&&S.day<=off+5&&S.day<360){
      const t=TPL.find(x=>x.k==='fest_'+f.k);if(!t)continue;
      S.fest[f.k]=1;return t;
    }
    if(S.day>off+5)S.fest[f.k]=1;
  }
  return null;
}

  'คุณปักเสาล่อฟ้าไว้ห่างจากที่พัก ฟ้าผ่าลงไปที่เสาแทน และคุณเก็บของที่ร้านใกล้ๆ ได้ฟรี',
  ['ช่วยลากวัวควายเข้าคอกก่อนก้อนใหญ่ตก','ชาวบ้านเฒ่าเลี้ยงข้าวคุณมื้อใหญ่เพราะเห็นใจที่คุณไม่ทิ้งสัตว์']);
 E('s_fever','station','sad','sick','herb','ไข้ประหลาดในศูนย์พักพิง','คนที่นอนอยู่แถวมุมห้องเริ่มตัวร้อนจัดและมีผื่นสีแดง ผู้ดูแลห้ามไม่ให้ใครเข้าใกล้แต่ไม่มีใครรู้ว่ามันติดต่อกันหรือเปล่า',
  ['เข้าไปช่วยเช็ดตัวคนป่วยทั้งที่ไม่มีหน้ากาก','คนป่วยหายไข้ในสองวัน แต่ตัวคุณก็เริ่มอุ่นๆ ขึ้นมาเหมือนกัน','คุณติดไข้ไปด้วยและต้องนอนซมทั้งคืน'],
  ['แยกไปนอนมุมห้องไกลที่สุด','คุณนอนห่างจากทุกคนจนไม่ติดอะไรเลย แม้จะเหงาไปหน่อย','ห้องแคบเกินไป ละอองไอของคนไอยังลอยมาถึงคุณอยู่ดี'],
  'คุณต้มยาสมุนไพรแจกทุกคนทั้งห้อง ไข้ลดลงและหลายคนมาขอบคุณเป็นรายตัว',
  ['อาสาเฝ้าคนป่วยหนักตลอดคืน','คนป่วยหายใจดีขึ้นเมื่อเช้า และผู้ดูแลมอบเสบียงกล่องหนึ่งให้คุณ']);
 E('s_mosq','harbor','tense','sick','hazmat','ยุงยักษ์หลังน้ำลด','น้ำท่วมขังเต็มซอกตึกและยุงตัวเท่านิ้วโป้งบินเป็นกลุ่ม บางคนโดนกัดแล้วผิวบวมแดงเป็นวงใหญ่',
  ['ใช้ควันไล่ยุงจุดไล่ทั้งซอย','ควันขาวฟุ้งจนยุงเลี่ยงไปทางอื่น แม้คุณจะไอไปตลอดคืน','ควันตีกลับเข้าห้องและยุงกลุ่มหนึ่งยังโผล่มากัดจนตัวคุณลายไปหมด'],
  ['รีบอพยพไปที่แห้งบนเนินเขา','บนเนินลมแรงยุงไม่ตามมา คุณพักผ่อนได้จริงจังเป็นครั้งแรกในสัปดาห์','ทางขึ้นเนินเปียกลื่นคุณล้มหลายครั้งและโดนกิ่งไม้ขูด'],
  'คุณสวมชุดป้องกันแล้วเดินสำรวจหาบ่อน้ำขัง กำจัดแหล่งเพาะพันธุ์ได้ทั้งซอย',
  ['แจกยาทากันยุงให้เด็กๆ','เด็กๆ หัวเราะกันใหญ่เมื่อได้กลิ่นยา แล้วมีเด็กคนหนึ่งเอาผลไม้มาให้คุณ']);
 E('s_water','village','tense','sick','herb','น้ำบ่อที่ขุ่นแปลกๆ','น้ำบ่อกลางหมู่บ้านที่เคยใสกลับขุ่นสีเขียวและมีกลิ่นเหมือนเหล็กเก่า ชาวบ้านบางคนท้องเสียตั้งแต่เมื่อคืน',
  ['ต้มน้ำเดือดนานๆ แล้วดื่มเองเพื่อทดสอบ','น้ำต้มสุกใสขึ้นและคุณไม่เป็นอะไร ชาวบ้านจึงกล้าดื่มตาม','น้ำต้มก็ยังมีรสฝาดเฝื่อน คุณปวดท้องบิดเกือบทั้งคืน'],
  ['เดินไปหาน้ำที่คลองบนเขาไกลหลายกิโล','น้ำที่เขาใสเย็นเฉียบ คุณแบกกลับมาหลายขวดแล้วแบ่งเพื่อนบ้าน','เส้นทางขึ้นเขาลื่นและยาวนานจนคุณหมดแรงและเท้าพองทั้งสองข้าง'],
  'คุณต้มยาสมุนไพรให้คนท้องเสียดื่ม อาการทุเลาลงภายในวันเดียวและหมู่บ้านเอาข้าวมาตอบแทน',
  ['แบ่งน้ำสะอาดของตัวเองให้ครอบครัวที่ไม่มีเลย','ครอบครัวนั้นร้องไห้ด้วยความขอบคุณและสัญญาว่าจะตอบแทนสักวัน']);
 E('w_riot','market','chaos','crowd','rshield','แย่งข้าวสารหน้าห้าง','ข่าวลือว่าห้างจะปิดถาวรวันนี้ทำให้คนนับร้อยแห่เข้ามาแย่งกระสอบข้าวสาร ผลักกันจนมีคนล้มลงไปกองกับพื้น',
  ['แทรกตัวเข้าไปคว้ากระสอบมาให้ได้หนึ่งใบ','คุณคว้ากระสอบข้าวสารมาได้หนึ่งใบหลังโดนศอกสองสามที','คุณถูกคนกดทับจนหายใจไม่ออกและกระสอบหลุดจากมือไป'],
  ['ถอยออกมาแล้วรอดูอยู่ไกลๆ','คุณยืนดูจากรั้วร้านค้าตรงข้ามจนฝูงชนสลายตัวและเก็บของตกหล่นได้นิดหน่อย','ฝูงชนผลักรั้วจนล้มทับเท้าคุณ'],
  'คุณถือโล่ปราบจลาจลเปิดทางให้คนที่ล้มลุกขึ้น แล้วยามห้างให้ข้าวสารตอบแทนหนึ่งถุง',
  ['ช่วยพยุงคนที่ล้มลงออกมาจากกลางฝูงชน','เขาไอสำลักแล้วขอบคุณ ก่อนจะแบ่งอาหารกระป๋องให้คุณ']);
 E('w_stamp','street','chaos','crowd','megaph','ฝูงชนแตกตื่นบนสะพานลอย','เสียงระเบิดจากที่ไกลๆ ทำให้ฝูงชนบนสะพานลอยวิ่งไปทางเดียวกันพร้อมกัน ราวสะพานเริ่มสั่นและมีเสียงเหล็กดังเอี๊ยด',
  ['ตะโกนให้ทุกคนเดินช้าๆ ทีละแถว','คนส่วนใหญ่ได้ยินและชะลอ ราวสะพานหยุดสั่นอย่างน่าอัศจรรย์','เสียงคุณถูกกลบหมดและมีคนผลักคุณจนชนราวเหล็ก'],
  ['กระโดดลงบันไดข้างที่ไม่มีคน','คุณลงมาถึงพื้นก่อนใคร และมองเห็นฝูงชนเทลงมาจากบันไดอีกฝั่ง','คุณลื่นล้มกลางบันไดและตกลงมาหลายขั้น'],
  'คุณใช้โทรโข่งสั่งให้ทุกคนแยกเป็นสองแถว ทั้งสะพานเดินออกได้อย่างเป็นระเบียบ',
  ['อุ้มเด็กที่หลงทางไปไว้ที่ปลอดภัย','คุณอุ้มเด็กไว้จนแม่วิ่งมาตามหา เธอกอดลูกแล้วหันมายกมือไหว้คุณทั้งน้ำตา']);
 E('w_march','road','tense','crowd','megaph','ขบวนคนเดินเข้าหากำแพง','ผู้คนหลายพันเดินเป็นแถวยาวไปทางกำแพงเมืองโดยไม่พูดอะไรเลย บางคนยิ้มและบางคนร้องไห้ แต่ไม่มีใครหยุด',
  ['เดินสวนขบวนเพื่อไปอีกฝั่ง','คุณเบียดผ่านแถวยาวไปได้ในที่สุด และไม่มีใครมองหน้าคุณเลยสักคน','แถวผลักคุณกลับเข้าไปในทางของขบวนเกือบครึ่งชั่วโมงก่อนจะหลุดออกมาได้'],
  ['ตามเข้าขบวนไปแอบสังเกตการณ์','คุณเห็นว่าพวกเขาเดินไปรวมกันเฉยๆ เพราะหมดหวัง และได้ยินเรื่องสำคัญหลายอย่าง','คนข้างๆ เริ่มสงสัยและจับแขนคุณไว้แน่นจนช้ำ'],
  'คุณใช้โทรโข่งชวนคนที่อยากอยู่ต่อให้ถอยกลับ หลายสิบคนหยุดเดินและมองคุณด้วยแววตาโล่งใจ',
  ['แบ่งน้ำให้คนที่เดินจนหมดแรง','เขากระซิบขอบคุณและเดินกลับทางเดิมไปพร้อมกับน้ำขวดนั้น']);
 E('t_ambush','road','tense','trap','mirror','โจรซุ่มข้างทางลัด','รถบรรทุกเก่าจอดขวางทางในมุมอับ มีรอยล้อสดๆ และเศษอาหารกองอยู่ข้างทาง เหมือนมีคนซุ่มรอมานานแล้ว',
  ['เดินผ่านไปตรงๆ แล้วทำเป็นไม่รู้','คุณเดินผ่านโดยไม่หันซ้ายขวา และเสียงกระซิบหลังรถก็เงียบลงไปเอง','โจรกระโจนออกมาพร้อมมีดและเอาของไปครึ่งหนึ่งก่อนคุณจะหนีได้'],
  ['อ้อมไปทางเดียวกับที่มีรอยเท้าเด็ก','รอยเท้าเด็กพาไปถึงทางลับของชาวบ้านที่ปลอดภัยกว่า','ทางรกจนหนามเกี่ยวทั้งตัวและเสียเวลาไปครึ่งวัน'],
  'คุณใช้กระจกส่องมุมดูหลังรถ เห็นโจรสองคนนอนรอพอดีและเดินอ้อมไปอย่างเงียบๆ',
  ['เตือนกลุ่มชาวบ้านที่กำลังเดินมาทางนั้น','พวกเขาหยุดทันทีและส่งของกินมาให้คุณแทนคำขอบคุณ']);
 E('t_house','alley','creepy','trap','detect','บ้านร้างที่ประตูเปิดรออยู่','บ้านทรงเก่าปลายซอยมีประตูหน้าเปิดอ้า มีแสงเทียนจางๆ และเสียงเพลงจากแผ่นเสียงดังเบาๆ ราวกับมีคนเพิ่งออกไป',
  ['เข้าไปค้นหาของมีค่าด้านใน','คุณเจอกระเป๋าเงินแห้งสนิทใต้ฟูกเก่าโดยไม่มีอะไรเกิดขึ้นเลย','กับดักลวดเหล็กด้านในลั่นดังสนั่น และคุณต้องดิ้นหลุดทั้งที่ข้อเท้าเลือดซิบ'],
  ['โยนก้อนหินเข้าไปทดสอบก่อน','ก้อนหินกลิ้งไปโดนลวดดังสนั่น คุณหลบทันและเดินจากไปอย่างโล่งใจ','ก้อนหินไปโดนกระป๋องเปล่าลั่นเสียงดังจนมีอะไรบางอย่างตื่นขึ้นในบ้าน'],
  'เครื่องตรวจโลหะส่งเสียงเตือนที่ธรณีประตู คุณปลดกับดักออกแล้วขนของมีค่ากลับมาเต็มสองมือ',
  ['ปิดประตูบ้านแล้วเขียนป้ายเตือนคนอื่น','ป้ายของคุณช่วยให้คนอื่นไม่ต้องเข้าไป และมีหลายคนมาขอบคุณทีหลัง']);
 E('t_pit','forest','tense','trap','detect','หลุมพรางกลางทางลัด','ใบไม้ที่วางเรียงเป็นระเบียบผิดปกติปิดอยู่กลางทางเดินป่า เหมือนมีคนจงใจกลบอะไรบางอย่างไว้',
  ['เดินอ้อมขอบทางที่ไม่มีใบไม้','คุณเดินอ้อมหลุมไปได้และเห็นกระดูกสัตว์เต็มอยู่ก้นหลุมนั้น','พื้นดินขอบทางก็ทรุดตัวและคุณพลัดตกลงไปครึ่งตัว'],
  ['โยนกิ่งไม้ใหญ่พาดข้ามไปแล้วเดินตาม','กิ่งไม้ก็รับน้ำหนักได้พอดี คุณข้ามไปได้โดยไม่เปียกแม้แต่นิ้วเดียว','กิ่งไม้หักกลางทางและคุณหล่นลงมาเหยียบหลุมโคลนเต็มขา'],
  'เครื่องตรวจโลหะเตือนว่าใต้ใบไม้มีกับดักเหล็กสองจุด คุณเลี่ยงมันได้และเก็บของมีค่าที่ตกอยู่ใกล้ๆ',
  ['ช่วยชาวบ้านที่ตกหลุมขึ้นมา','เขาขอบคุณจนลืมความเจ็บ และบอกเส้นทางลัดที่ปลอดภัยให้คุณ']);
 E('t_signal','mountain','tense','trap','scope','สัญญาณขอความช่วยเหลือที่ผิดสังเกต','เสียงวิทยุซ้ำคำว่า ช่วยด้วย ที่เนินเขา แต่ทุกครั้งที่ซ้ำ น้ำเสียงเหมือนเดิมทุกพยางค์ราวกับถูกอัดไว้',
  ['ขึ้นไปดูตามสัญญาณ','คุณเจอเครื่องส่งเก่าและกล่องเสบียงเล็กๆ ซ่อนอยู่ไม่ไกล','มีคนซุ่มรอบริเวณนั้นจริงๆ และคุณต้องสู้ถอยจนหนีลงเขามาได้'],
  ['ส่งสัญญาณกลับไปแล้วรอดูอยู่ไกลๆ','มีสองคนออกมาเดินวนหาคนตอบ คุณจึงรู้ว่าอย่าเข้าไปเด็ดขาด','เสียงของคุณดึงดูดมากกว่าที่คิด และมีคนเริ่มเดินขึ้นมาทางที่คุณอยู่'],
  'คุณส่องกล้องดูทั่วเนินก่อน เห็นแล้วว่ามีคนซ่อนอยู่หลังก้อนหิน และเลี่ยงไปทางอื่นอย่างสบาย',
  ['เตือนคนในหมู่บ้านด้วยวิทยุของคุณ','ชาวบ้านขอบคุณและยกของกินให้ เพราะรู้ว่าคุณช่วยให้พวกเขาไม่เดินเข้าไปติดกับดักนั้น']);
 E('q_after','room','tense','quake','gobag','แผ่นดินไหวตามตอนเที่ยงคืน','เสียงครืนจากใต้พื้นปลุกคุณขึ้นมา แก้วน้ำบนโต๊ะแตกกระจาย โคมไฟแกว่ง และปูนบนเพดานร่วงลงมาเป็นก้อน',
  ['มุดใต้โต๊ะแล้วรอจนสงบ','คุณกำขอบโต๊ะไว้แน่น ผ่านไปสามสิบวินาทีที่ยาวเหมือนสามชั่วโมง','ก้อนปูนใหญ่ตกลงมากระแทกโต๊ะจนหลังคุณชาไปครึ่งซีก'],
  ['วิ่งลงบันไดออกไปที่โล่ง','คุณลงมาถึงพื้นก่อนแรงสั่นรอบสองและยืนมองตึกสั่นอยู่ไกลๆ','บันไดแตกร้าวและเศษปูนหล่นใส่ศีรษะระหว่างวิ่ง'],
  'คุณคว้ากระเป๋าหนีภัยที่เตรียมไว้หน้าประตูแล้วออกไปที่โล่งโดยไม่ต้องคิดอะไรเลย',
  ['ช่วยเพื่อนบ้านที่ติดอยู่หลังตู้ที่ล้มทับ','เขาออกมาได้ด้วยการช่วยกันสองคน และให้คุณพักที่บ้านเขาในคืนที่เหลือ']);
 E('q_crack','road','chaos','quake','spring','รอยแยกกลางถนนใหญ่','พื้นถนนแตกเป็นรอยแยกกว้างสองเมตรทอดยาวตรงกลางทาง รถหลายคันจอดค้างอยู่ข้างๆ และฝุ่นยังฟุ้งไม่จาง',
  ['กระโดดข้ามรอยแยกตรงจุดแคบที่สุด','คุณกระโดดข้ามไปได้อย่างหวุดหวิด ขาสั่นไปอีกสิบนาที','ปลายเท้าไม่ถึงขอบอีกฝั่งและคุณห้อยตัวอยู่ก่อนจะปีนขึ้นมาได้'],
  ['เดินอ้อมไปหาสะพานไม้ที่ชาวบ้านทำไว้','สะพานไม้สั่นแต่ทนทาน คุณข้ามไปพร้อมคนอีกหลายสิบคน','สะพานไม้โยกจนคุณเกือบตกและเสียวไส้ไปทั้งตัว'],
  'รองเท้าสปริงทำให้ก้าวของคุณยาวกว่าปกติ คุณข้ามไปได้ง่ายแล้วช่วยดึงคนอื่นข้ามตามมา',
  ['ช่วยลากเด็กที่เกาะขอบรอยแยกขึ้นมา','เด็กหายใจโล่งและพ่อแม่ของเขาจับมือคุณจนแน่น']);
 E('fl_surge','village','tense','flood','sandbag','น้ำป่าไหลหลากตอนฟ้ามืด','เสียงเหมือนรถไฟวิ่งดังมาจากตีนเขาและน้ำสีโคลนไหลทะลักเข้าถนนเร็วกว่าคนวิ่ง ชาวบ้านกรีดร้องให้ขึ้นที่สูง',
  ['วิ่งขึ้นที่สูงกว่าที่เห็นทันที','คุณขึ้นไปถึงดาดฟ้าตึกสองชั้นพอดีกับที่น้ำไหลผ่านถนนเบื้องล่าง','น้ำกระชากขาคุณไปกลางทางและคุณต้องเกาะเสาไฟจนมือเลือดออก'],
  ['คว้าเชือกแล้วผูกตัวเองกับเสาไว้','เชือกทำให้คุณไม่ถูกน้ำพัดไป แม้จะตัวแข็งไปทั้งตัว','เชือกบาดข้อมือและเสาที่ผูกโยกเพราะแรงน้ำ'],
  'คุณวางถุงทรายกั้นประตูไว้ก่อนแล้ว น้ำเข้าที่พักน้อยกว่าบ้านอื่นมาก คุณจึงเปิดประตูให้เพื่อนบ้านมาพักด้วย',
  ['ช่วยลากเด็กและคนแก่ขึ้นหลังคา','ทุกคนที่คุณช่วยตะโกนขอบคุณจนเสียงแหบทั้งคืน']);
 E('fl_pipe','street','chaos','flood','sandbag','ท่อประปาแตกใต้ตึก','น้ำพุ่งขึ้นจากพื้นถนนสูงเท่าตึกสองชั้นและไหลเข้าชั้นล่างของอาคารทุกหลังอย่างรวดเร็ว',
  ['ไปปิดวาล์วใหญ่ที่หัวมุมถนน','คุณหมุนวาล์วจนแขนระบมแต่น้ำค่อยๆ เบาลงและถนนกลับมาแห้งช้าๆ','แรงน้ำสาดเข้าหน้าจนคุณล้ม และเข่ากระแทกพื้นถนนเต็มแรง'],
  ['ขนของขึ้นชั้นสองก่อนน้ำถึง','คุณขนของสำคัญขึ้นไปได้เกือบหมดก่อนน้ำเริ่มท่วมเต็มห้อง','น้ำมาเร็วกว่าที่คิดและของบางอย่างเสียหายไปแล้ว'],
  'คุณวางถุงทรายตามประตูและทางเข้า น้ำเข้าไม่ถึงที่พักคุณเลย และเพื่อนบ้านมาขอยืมถุงทรายไปใช้ด้วย',
  ['ช่วยเพื่อนบ้านขนของขึ้นที่สูง','เพื่อนบ้านตอบแทนด้วยอาหารกล่องที่ทำเองทั้งหมู่']);
 E('st_bolt','farm','tense','storm','rod','พายุฟ้าผ่ากลางทุ่ง','เมฆดำลอยต่ำจนเหมือนแตะหลังคา ฟ้าผ่าแต่ละครั้งทำให้ผมลุกชันและกลิ่นโอโซนฟุ้งไปทั้งทุ่ง',
  ['นั่งยองๆ บนพื้นเท้าชิดกันและห้ามขยับ','คุณนั่งนิ่งเหมือนก้อนหินและฟ้าผ่าลงที่ต้นไม้ห่างไปสิบเมตร','ฟ้าผ่าใกล้จนแรงกระแทกผลักคุณล้มลงและหูอื้อไปครึ่งวัน'],
  ['วิ่งเข้าโรงนาร้างที่ปลายทุ่ง','คุณถึงโรงนาก่อนฝนห่าใหญ่ และมองเห็นสายฟ้าผ่าใกล้ๆ ผ่านรอยแตกของฝา','หลังคาสังกะสีสั่นสะเทือนทุกครั้งที่ฟ้าผ่าและทำให้คุณหูอื้อ'],
  'คุณปักเสาล่อฟ้าไว้ห่างออกไป ฟ้าลงที่เสานั้นทุกครั้ง คุณนั่งดูอย่างปลอดภัยพร้อมน้ำชาร้อนๆ',
  ['ช่วยคนเลี้ยงควายต้อนสัตว์เข้าคอก','คนเลี้ยงควายขอบคุณและแบ่งนมสดให้คุณหนึ่งขวด']);
 E('m_pack','alley','tense','monster','bait','ฝูงสุนัขจรหิวโซ','สุนัขเก้าตัวเดินล้อมตรอกจากสามทิศ ซี่โครงโผล่ตามตัว และสายตาของมันจับจ้องถุงอาหารในมือคุณไม่วางตา',
  ['ถอยช้าๆ และไม่สบตา','คุณถอยออกจนสุดซอยโดยที่ไม่มีตัวไหนกล้าเข้ามา','ตัวหัวหน้ากระโจนใส่ขาคุณและกัดเอาไปคำหนึ่ง'],
  ['โยนอาหารไปอีกมุมแล้ววิ่งหนี','ฝูงสุนัขวิ่งไปแย่งอาหารกันเอง คุณจึงรีบหนีออกมาได้','อาหารหมดไวกว่าที่คิดและมันตามมา คุณต้องปีนรั้วหนี'],
  'คุณวางชุดล่อกลิ่นไว้อีกฝั่งของซอย ฝูงสุนัขตามกลิ่นไปทั้งหมดและคุณเดินออกมาอย่างสบาย',
  ['ให้อาหารสุนัขลูกอ่อนตัวผอมที่ตามมา','ลูกสุนัขตัวนั้นเดินตามคุณมาถึงหน้าบ้านและนอนหลับไปในทันที']);
 E('m_bear','park','tense','monster','bait','หมีหลุดจากสวนสัตว์','ร่างสีน้ำตาลใหญ่เท่าตู้เย็นเดินสะบัดตัวกลางสนามหญ้า กรงเหล็กที่ขาดเป็นท่อนอยู่ข้างหลังมันห่างไปไม่ไกล',
  ['ทำตัวให้ใหญ่และถอยช้าๆ','หมีมองคุณนิ่งแล้วหันไปทางอื่น เหมือนไม่คิดว่าคุณคุ้มกับการไล่','หมีเงยหัวแล้วพุ่งเข้าใส่ ตะปบไหล่คุณก่อนจะเปลี่ยนใจ'],
  ['ปีนต้นไม้ใหญ่ที่ใกล้ที่สุด','หมีเดินวนใต้ต้นไม้อยู่นานก่อนจะเดินจากไป แขนคุณสั่นจนปล่อยกิ่งแทบไม่ได้','กิ่งไม้หักและคุณหล่นลงมาจากความสูงสามเมตร'],
  'คุณวางผลไม้กับชุดล่อกลิ่นไว้ไกลๆ หมีเดินตามกลิ่นไปและคุณหนีออกมาจากสวนอย่างเงียบ',
  ['เตือนครอบครัวที่ปิกนิกอยู่ฝั่งตรงข้าม','ครอบครัวนั้นรีบเก็บของและวิ่งออกมา พ่อของพวกเขายื่นอาหารกล่องให้คุณ']);
 E('m_croc','harbor','spooky','monster','scope','จระเข้ในคลองหลังบ้าน','ผิวน้ำนิ่งผิดปกติและมีฟองอากาศผุดเป็นระยะ ก่อนจะเห็นสันหลังขรุขระยาวเกือบสี่เมตรโผล่ขึ้นมาแล้วจมกลับลงไปช้าๆ',
  ['ถอยห่างจากริมคลองไปไกลๆ','คุณเดินถอยหลังโดยไม่ละสายตาจนห่างจากคลองสิบเมตรและโล่งอกที่สุด','จระเข้พุ่งขึ้นมาชั่วพริบตา ปากมันงับตะกร้าของคุณขาดเป็นสองท่อน'],
  ['ใช้ไม้ยาวทดสอบว่ามันยังอยู่ตรงนั้นไหม','ไม้ถูกงับหักกลางทันที คุณจึงรู้ว่ามันยังอยู่และเลี่ยงทางไปอย่างไว','ไม้ติดปากมันและดึงคุณเซลงไปที่ขอบน้ำ'],
  'คุณส่องกล้องดูทั่วริมคลองแล้วเลือกเส้นทางที่ห่างจากมันที่สุด ไม่มีเรื่องร้ายเกิดขึ้นเลย',
  ['ตะโกนเตือนเด็กที่เล่นน้ำอยู่ริมคลอง','เด็กวิ่งขึ้นมาได้ทัน ผู้ใหญ่ที่เห็นยื่นกล้วยให้คุณหวีหนึ่ง']);
 E('h_hollow','school','spooky','ghost','salt','เสียงกระซิบจากโรงเรียนเก่า','ห้องเรียนที่ไม่มีใครใช้มานานมีเสียงชอล์กขีดบนกระดานดังเบาๆ และมีเสียงเด็กหัวเราะคิกคักหลังประตูที่ล็อกจากข้างนอก',
  ['เปิดประตูเข้าไปดูกับตา','ในห้องไม่มีใครเลย แต่บนกระดานมีข้อความว่า ขอบคุณที่มาเยี่ยม เขียนด้วยลายมือเด็กอนุบาล','ประตูปิดลงเองด้านหลังคุณและเสียงหัวเราะดังขึ้นพร้อมกันจนคุณตัวชา'],
  ['ทิ้งขนมไว้หน้าห้องแล้วเดินออกไป','เสียงหัวเราะเงียบลงและขนมหายไปก่อนที่คุณจะเดินพ้นรั้ว','ก้าวเท้าเดินออกไปแล้วรู้สึกเหมือนมีมือเล็กๆ จับชายเสื้อไว้อยู่นานก่อนปล่อย'],
  'คุณโรยเกลือหินเป็นเส้นหน้าห้อง เสียงหัวเราะหยุดลงแล้วค่อยๆ จางไปเหมือนเด็กๆ กลับบ้านกันหมดแล้ว',
  ['นั่งเล่านิทานหน้าห้องสักครู่','เสียงในห้องเงียบกริบ แล้วมีเสียงเด็กพึมพำว่า อีกหน่อยได้ไหม จนคุณรู้สึกอบอุ่นอย่างบอกไม่ถูก']);
 E('h_shrine','village','mystic','ghost','beads','ศาลเจ้าที่มีคนจุดธูปให้','ธูปสามดอกที่ศาลเจ้าปากทางหมู่บ้านถูกจุดใหม่ทุกเช้า ทั้งที่ไม่มีใครเห็นใครมาจุด และควันธูปลอยไปทางบ้านหลังเดียวเท่านั้น',
  ['จุดธูปไหว้และขออนุญาตผ่านทาง','ควันธูปลอยตามคุณไปจนสุดซอยแล้วค่อยๆ จางเหมือนส่งคุณถึงที่หมาย','ลมเย็นพัดดับธูปทั้งสามดอกพร้อมกัน และคุณรู้สึกเหมือนมีใครมองอยู่ข้างหลัง'],
  ['ย่องผ่านศาลไปเงียบๆ โดยไม่หันมอง','คุณเดินผ่านโดยไม่เกิดเรื่องใดเลย แต่หัวใจเต้นแรงตลอดทาง','พื้นเสียงลั่นดังและมีเงาหนึ่งตามคุณมาจนหัวถนนก่อนจะหายไป'],
  'คุณถือลูกประคำภาวนาตลอดทาง ควันธูปลอยตามเป็นทางเหมือนเป็นเพื่อนเดินและทิ้งของเซ่นไหว้ที่ตกอยู่ให้คุณเก็บ',
  ['ช่วยทำความสะอาดศาลและเปลี่ยนน้ำให้','บรรยากาศรอบศาลสงบลงจนผู้เฒ่าที่ผ่านมาเอาผลไม้มาให้คุณ']);
 E('th_pick','market','tense','steal','chain','นักล้วงกระเป๋าฝีมือดี','ชายใส่เสื้อแจ็กเก็ตเดินชนไหล่คุณเบาๆ พร้อมขอโทษด้วยรอยยิ้ม ก่อนที่คุณจะสังเกตว่ากระเป๋าข้างตัวเบากว่าเดิม',
  ['วิ่งไล่ตามไปให้ทัน','คุณวิ่งตามจนทันและแย่งกระเป๋าคืนมาได้ แต่เขาเตะคุณก่อนหนี','เขาหายเข้าไปในฝูงชนและคุณถูกใครบางคนผลักล้มจนเข่าถลอก'],
  ['ตะโกนเรียกคนในตลาดให้ช่วย','ชาวตลาดช่วยกันล้อมและเขาทิ้งกระเป๋าไว้ก่อนจะวิ่งหนี','ไม่มีใครสนใจเลยเพราะทุกคนยุ่งกับเรื่องของตัวเอง'],
  'คุณพันโซ่ล็อกกระเป๋าไว้กับเข็มขัด เขาดึงเท่าไรก็ไม่ออกและเดินจากไปด้วยท่าทางหงุดหงิด',
  ['ช่วยคุณป้าที่ถูกล้วงกระเป๋าเหมือนกัน','คุณป้าขอบคุณและแบ่งผลไม้ที่ขายอยู่ให้เป็นการตอบแทน']);
 E('th_break','room','tense','steal','safe','คนงัดประตูกลางดึก','เสียงไขควงงัดบานพับดังอยู่ที่ประตู คุณเห็นเงาสองเงาใต้ช่องประตูและแสงไฟฉายเล็กๆ กวาดไปมาบนพื้น',
  ['ตะโกนขู่ว่ามีปืน','เงาทั้งสองชะงักและถอยออกไป คุณยืนใจเต้นตึกตักจนเช้า','พวกเขาไม่เชื่อแล้วกระแทกประตูเข้ามาและต่อยคุณก่อนคว้าของไป'],
  ['แอบหนีออกทางหน้าต่างหลังบ้าน','คุณลงมาถึงพื้นอย่างเงียบเชียบและวิ่งไปเรียกคนในซอยมาช่วย','ราวระเบียงหักและคุณตกลงมากระแทกพื้นดินแข็งๆ'],
  'ของมีค่าทั้งหมดอยู่ในตู้เซฟเหล็ก โจรงัดอยู่นานก่อนยอมแพ้และเดินจากไปมือเปล่า',

function weightedPick(){
  let tot=0;
  const ws=TPL.map(t=>{
    let w=t.w||1;
    if(t.req&&!t.req(S))w=0;
    if(S.cool[t.k]!=null&&S.day<S.cool[t.k])w=0;
    if(w&&t.boost)w*=t.boost(S);
    if(w&&(t.dis||KEYCAT[t.k]==='danger'))w*=DIFF.danger;
    tot+=w;return w;
  });
  if(tot<=0){S.cool={};return TPL[0]}
  let r=RND()*tot;
  for(let i=0;i<TPL.length;i++){r-=ws[i];if(r<=0)return TPL[i]}
  return TPL[0];
}

function addStat(k,v,o){
  if(!v)return;
  if(INVK.includes(k)){const b=S.inv[k];S.inv[k]=Math.max(0,b+v);const dv=S.inv[k]-b;if(dv){o.inv=o.inv||{};o.inv[k]=(o.inv[k]||0)+dv}return}
  if(k==='ix')return;
  if(k==='mo'&&v>0&&typeof MONEYX==='function')v=Math.round(v*MONEYX());
  if(k==='mo'&&tfx()>1)v=Math.round(v*(1+(tfx()-1)*.9));
  const b=S[k];
  S[k]=k==='mo'?S[k]+v:clamp(S[k]+v,0,100);
  const dv=S[k]-b;
  if(dv){o.deltas[k]=(o.deltas[k]||0)+dv;if(k==='mo'){if(dv>0)S.c.earned+=dv;else S.c.spent-=dv}}
}
function upkeep(d,o){
  // ลดลงตามเวลา
  {const ds=1+(tfx()-1)*.35;S.fd-=3.6*d/ds*DIFF.drain;S.wt-=4.3*d/ds*DIFF.drain}S.en=Math.min(100,S.en+3*d);
  o.eat=o.eat||0;o.drink=o.drink||0;o.stuck=o.stuck||0;
  // กินอัตโนมัติ
  let g=0;
  while(S.fd<42&&g++<8){
    if(S.inv.food>0){S.inv.food--;S.fd+=45+cookB();o.eat++;S.c.eaten++}
    else{const p=price.food();if(S.mo>=p&&RND()>scarcity()){S.mo-=p;S.c.live+=p;S.fd+=45;o.eat++;o.cost=(o.cost||0)+p}else if(RND()>.3+scarcity()*.7){S.fd+=30;o.scrounge=(o.scrounge||0)+1}else{o.stuck++;break}}
  }
  g=0;
  while(S.wt<42&&g++<8){
    if(S.inv.water>0){S.inv.water--;S.wt+=45;o.drink++}
    else{const p=price.water();if(S.mo>=p&&RND()>scarcity()*.8){S.mo-=p;S.c.live+=p;S.wt+=45;o.drink++;o.cost=(o.cost||0)+p}else if(RND()>.25+scarcity()*.7){S.wt+=30;o.scrounge=(o.scrounge||0)+1}else{o.stuck++;break}}
  }
  S.fd=clamp(S.fd,0,100);S.wt=clamp(S.wt,0,100);
  // ผลจากการขาดแคลน
  if(S.fd<=0){S.hp-=1.7*d;o.hunger=1}
  if(S.wt<=0){S.hp-=2.5*d;o.thirst=1}
  if(S.fd<20||S.wt<20)S.md=clamp(S.md-.8*d,0,100);
  if(S.en<=0){S.hp-=.8*d;S.md=clamp(S.md-.5*d,0,100)}
  // แผลและการติดเชื้อ
  if(S.wd>0){
    if(S.wd>25&&RND()<.18*d*aidMul()*DIFF.infM)S.inf=clamp(S.inf+rr(6,14),0,100);
    S.wd=Math.max(0,S.wd-(S.en>40?1.4:.5)*d*DIFF.heal);
  }
  if(S.inf>0){S.hp-=S.inf/32*d;S.inf=Math.max(0,S.inf-.6*d)}
  // ที่พัก
  S.sh.cond=Math.max(0,S.sh.cond-.05*d);
  // กลุ่ม
  if(S.crew.length){
    S.cf+=.1*S.crew.length*d;
    while(S.cf>=1){S.cf--;if(S.inv.food>0)S.inv.food--;else{S.cs++;}}
    if(S.cs>=3){const m=S.crew.pop();S.cs=0;o.extra.push(m.n+' ทนความหิวไม่ไหวและเดินจากกลุ่มไปในคืนหนึ่ง คุณไม่โกรธ แค่เงียบไปนาน');S.md=clamp(S.md-6,0,100);o.crewLeft=m.n}
    S.md=clamp(S.md+.04*S.crew.length*d,0,100);
  }
}
function advance(d,o){
  S.day+=d;
  const liv=Math.round(24*S.scale*d/10)*10;
  S.mo-=liv;S.c.live+=liv;o.cost=(o.cost||0)+liv;
  S.ht=Math.max(0,Math.round(S.ht-.3*d));
  if(S.md>=45&&S.mo>=0&&S.fd>20&&S.wt>20)S.hp=Math.min(100,S.hp+.07*d);
  if(S.mo<0){const dm=Math.min(8,Math.ceil(d*.7));S.md=clamp(S.md-dm,0,100);o.debt=(o.debt||0)+dm}
  upkeep(d,o);

}
function normalize(){

const KEYDEATH={meal:['choke','allergy','mushroom','spicy','veg'],thrill:['cliff','crash','jetski','fall','bee'],drive:['crash','supercar','bus'],trip:['bus','bee','snake','cliff','drown','mushroom'],

function isRich(){return S.mo>=2000000}

function fateCause(ev,fail){
  if(S.day<14)return null;
  const cat=ev.cat||'doom';
  let p=DIFF.fateBase;
  if(fail&&(cat==='danger'||ev.k==='thrill'))p+=DIFF.fateFail;else if(fail)p+=DIFF.fateAny;
  if(fail&&ev.arc)p+=.10+(ev.ep||1)*.02;
  if(S.hp<35)p*=1.8;if(S.en<20)p*=1.3;
  if(isRich())p+=.012;
  if((S.flags.veg||0)>=2)p+=.05*(S.flags.veg-1);
  if(RND()>=p)return null;
  if((S.flags.veg||0)>=2&&RND()<.6)return 'veg';
  if(isRich()&&RND()<.55)return pick(RICHD);

}
function statCause(ev){
  if(S.fd<=0)return 'starve';if(S.wt<=0)return 'thirst';if(S.inf>=40)return 'infect';if(S.wd>=40)return 'wound';
  if(S.md<=12)return 'heartbreak';if(S.ht>=70)return 'chased';if(S.en<=0)return 'exhaust';
  if(ev)return pick(KEYDEATH[ev.k]||CATDEATH[ev.cat]||CATDEATH.doom);return 'heartattack';
}
function nearOrDie(cause,o){
  if(S.save>0){
    S.save--;S.c.near++;S.nd++;
    S.hp=clamp(Math.max(S.hp,0)+0,0,100);S.hp=Math.max(12,Math.min(S.hp,22));
    S.md=clamp(S.md-8,0,100);
    if(cause==='exhaust')S.en=Math.max(S.en,50);
    if(cause==='starve'||cause==='thirst'){S.fd=Math.max(S.fd,40);S.wt=Math.max(S.wt,40)}
    if(cause==='infect'||cause==='wound'){S.inf=Math.min(S.inf,15);S.wd=Math.min(S.wd,15)}
    if(S.mo<0&&cause==='chased')S.ht=Math.min(S.ht,40);
    o.near=cause;o.extra.push('<b>เฉียดตาย!</b> '+DEATHS[cause].near+' (ชะตายังเมตตาให้คุณอีก '+S.save+' ครั้ง)');
    S.log.push({d:Math.floor(S.day),t:'เฉียดตาย: '+DEATHS[cause].t,ok:false,g:null,imp:9});
    return false;
  }
  S.cause=cause;return true;
}

/* ----- สรุปผลหลังทำอะไรสักอย่าง ----- */
function settle(o,ev,failed){
  // ตายจากชะตา (ไม่ใช่ตัวเลข)
  if(ev&&!o.dead){const c=fateCause(ev,failed);if(c&&nearOrDie(c,o)){o.end='died';return o}}
  if(S.hp<=0){normalize();if(S.hp<=0){if(nearOrDie(statCause(ev),o)){o.end='died';return o}}}
  if(S.ht>=DIFF.arrest){
    S.c.jail++;S.flags.record=1;
    advance(DIFF.jailDays,o);addStat("md",-12,o);S.ht=35;
    S.jailed=S.day>=365?1:0;
    o.arrest=true;
    o.extra.push('ความร้อนของคุณเต็มหลอด ตำรวจรวบตัวคุณได้ที่หัวมุมถนน คุณถูกขังอยู่ในห้องขัง '+DIFF.jailDays+' วัน');
    normalize();
    if(S.hp<=0&&nearOrDie(statCause(ev),o)){o.end='died';return o}
  }
  if(S.md<=0){
    S.md=24;S.hp=clamp(S.hp-8,0,100);advance(4,o);
    o.extra.push('ใจของคุณพังลงชั่วครู่ คุณนอนเฉยอยู่หลายวันโดยไม่อยากทำอะไร เมื่อลุกขึ้นได้อีกครั้ง ร่างกายอ่อนแรงกว่าเดิม');
    normalize();
    if(S.hp<=0&&nearOrDie('heartbreak',o)){o.end='died';return o}
  }
  if(!S.gift&&S.day>=200){S.gift=1;S.save++}
  if(S.day>=365){
    if(S.jailed)o.end='jail';
    else if(S.done.final){o.end='final';S.day=365}
    else S.day=364;
  }
  return o;
}

  if(c.raw.cx&&o.ok){const cx=c.raw.cx,mi=S.crew.findIndex(m=>m.tr===cx.tr);

}

const SHOPN=['ตลาดมืดท้ายซอย','พ่อค้าเร่รถเข็น','ร้านของเก่าข้างวัด','ท้ายรถกระบะลึกลับ','แผงลอยใต้สะพาน','คลังของทหารผ่านศึก'];
const shopMul=()=>Math.min(2.6,1+.07*(S.bTot|0))*((S.shop&&S.shop.mod)||1)*barterMul();
function rollShop(){
  const free=SHOPK.filter(k=>!S.gear[k]);
  const g=shuffle(free).slice(0,rr(3,5)),s=shuffle(SHOP_SUP.map((x,i)=>i)).slice(0,rr(4,6));
  const mod=pick([1,1,1,.8,1.3]);
  const tk=[];if(RND()<.10)tk.push('gold');if(RND()<.05)tk.push('diamond');if(RND()<.03)tk.push('demon');
  S.shop={name:pick(SHOPN),g,s,gs:[],ss:[],tk,tc:[],mod,tag:mod<1?'ลดราคาวันนี้ -20%':mod>1?'ของขาดตลาด +30%':''};
  S.buyN=0;
}
const gP=k=>roundMoney(gearPrice(k)*shopMul()),sP=s=>roundMoney(supPrice(s)*shopMul());
function buyLeft(){return SHOP_MAX-(S.buyN|0)}
function buyGear(k){
  if(buyLeft()<=0)return {ok:false,msg:'ซื้อได้ '+SHOP_MAX+' ครั้งต่อเหตุการณ์ ไปเจอเหตุการณ์ถัดไปก่อน'};
  if(S.gear[k])return {ok:false,msg:'มีแล้ว'};
  const p=gP(k);if(S.mo<p)return {ok:false,msg:'เงินไม่พอ'};
  S.mo-=p;S.c.spent+=p;S.gear[k]=1;S.buyN=(S.buyN|0)+1;S.bTot=(S.bTot|0)+1;S.shop.gs.push(k);if(k==='gun')S.ht=Math.min(100,S.ht+6);
  S.log.push({d:S.day,t:'ซื้อ'+GEAR[k].n,ok:true,g:'wealth',imp:1});
  return {ok:true,msg:'ซื้อ'+GEAR[k].n+' แล้ว (-'+fmt(p)+')'};
}
function buySup(i){
  if(buyLeft()<=0)return {ok:false,msg:'ซื้อได้ '+SHOP_MAX+' ครั้งต่อเหตุการณ์ ไปเจอเหตุการณ์ถัดไปก่อน'};
  const s=SHOP_SUP[i],p=sP(s);
  if(S.mo<p)return {ok:false,msg:'เงินไม่พอ'};
  S.mo-=p;S.c.spent+=p;if(s.fx)s.fx();else S.inv[s.k]+=s.q;S.buyN=(S.buyN|0)+1;S.bTot=(S.bTot|0)+1;S.shop.ss.push(i);
  return {ok:true,msg:'ซื้อ'+s.n+' แล้ว (-'+fmt(p)+')'};
}

function useTicket(t){
  if(!tixHave(t))return {ok:false,msg:'ไม่มี'+TIXN[t]};
  if((S.tixUsed|0)>=TIX_LIFE)return {ok:false,msg:'ใช้ตั๋วได้ไม่เกิน '+TIX_LIFE+' ใบต่อชีวิต และคุณใช้ครบแล้ว'};
  if((S.tixEv|0)>=1)return {ok:false,msg:'ใช้ตั๋วได้ 1 ใบต่อเหตุการณ์ ไปเจอเหตุการณ์ถัดไปก่อน'};
  S.tix[t]--;S.tixUsed=(S.tixUsed|0)+1;S.tixEv=1;if(t==='demon')S.usedDemon=1;
  const pool=REW[t].slice(),n=t==='demon'?2:1,out=[];
  for(let i=0;i<n;i++){const f=pool.splice(rnd(pool.length),1)[0];out.push(f())}

}

function doHustle(o){
  const [lab,lines]=hustleInfo();
  const m=scaleMoney(rr(800,1800));addStat('mo',m,o);addStat('md',-1,o);
  o.text=pick(lines);
  const r=S.role.n;
  if(TROUBLE[r]&&RND()<.2){S.ht=clamp(S.ht+rr(5,10),0,100);addStat('hp',-rr(3,8),o);o.extra.push(TROUBLE[r]+' คุณหนีออกมาได้แต่ใจยังเต้นแรง')}

  if(RND()<.1){const b=scaleMoney(rr(400,1200));addStat('mo',b,o);o.extra.push('ลูกค้าคนหนึ่งให้ทิปเพิ่มโดยไม่บอกเหตุผล')}
}

const SKTH=[3,8,15,26,40];
const skXp=id=>(S&&S.sk&&S.sk[id])|0;
function skLv(id){const x=skXp(id);let l=0;for(const t of SKTH)if(x>=t)l++;return l}
function skillGain(id,n,o){
  if(!S.sk)S.sk={};
  const b=skLv(id);S.sk[id]=skXp(id)+n;const a=skLv(id);
  if(a>b&&o){const s=SKL.find(x=>x.id===id);o.extra.push('✨ ทักษะ <b>'+s.n+'</b> ขึ้นเป็นเลเวล '+a+' แล้ว')}
}
function skillInit(){
  S.sk={};
  const n=S.role.n||'';
  const m=[[/ข้าว|ครัว|เชฟ|หมูปิ้ง|อาหาร|ก๋วยเตี๋ยว|กาแฟ|ขนม|ปลา/,'cook'],[/หมอ|พยาบาล|เภสัช|ยา(?!บ้า)|ผดุง/,'aid'],[/ทหาร|ตำรวจ|ดาบ|มวย|ยาม|นักสู้|กู้ภัย|คุมประพฤติ/,'fight'],[/พ่อค้า|แม่ค้า|นายหน้า|ขาย|ธนาคาร|ทนาย|โบรก/,'barter'],[/ขโมย|นักเดินป่า|เก็บ|ขยะ|นักสำรวจ|นักล่า/,'scav'],[/ช่าง|วิศวกร|ก่อสร้าง|สถาปนิก|เกษตร|ชาวสวน/,'build']];
  for(const [re,k] of m)if(re.test(n))S.sk[k]=SKTH[0];
}
const cookB=()=>skLv('cook')*3+(upOwn('stove')?6:0);
const aidMul=()=>1-skLv('aid')*.1;
const barterMul=()=>1-skLv('barter')*.04;
function skRisk(e,cat){
  let r=0;
  if(cat==='danger'||e==='fight')r+=skLv('fight')*.015;
  if(e==='talk')r+=skLv('barter')*.015;
  if(e==='steal')r+=skLv('scav')*.015;
  if(cat==='health')r+=skLv('aid')*.012;
  if(cat==='danger'&&upOwn('basement'))r+=.03;
  return r;
}
function skillEv(ev,c,o,tag){
  try{
    let n=0;const e=c.raw&&c.raw.k&&c.raw.k.e;
    const g=(id,v)=>{if(n<2){skillGain(id,v,o);n+=v}};
    if(tag==='help'&&o.ok)g('aid',1);
    if(e==='fight')g('fight',o.ok?2:1);else if(e==='talk')g('barter',o.ok?2:1);else if(e==='steal')g('scav',o.ok?2:1);
    if(ev.cat==='danger'&&o.ok)g('fight',1);
    if(tag==='wealth'&&o.ok)g('barter',1);
  }catch(x){}
}
function skillAct(id,o){
  try{
    if(id==='food'&&o.ok)skillGain('cook',1,o);
    else if(id==='fix')skillGain('build',1,o);
    else if(id==='scav'&&o.ok)skillGain('scav',1,o);
    else if(id==='heal')skillGain('aid',2,o);
    else if(id==='work')skillGain('barter',1,o);
  }catch(x){}
}

/* ---- ซื้ออัปเกรด ---- */
const upMat=u=>Math.max(1,u.mat-(skLv('build')>=4?2:skLv('build')>=2?1:0));
const upMo=u=>scaleMoney(u.mo);
function upCan(u){
  if(upOwn(u.id))return {ok:false,msg:'ติดตั้งแล้ว'};
  if(u.pre&&!upOwn(u.pre))return {ok:false,msg:'ต้องมี '+UPG.find(x=>x.id===u.pre).n+' ก่อน'};
  if(S.inv.mat<upMat(u))return {ok:false,msg:'วัสดุไม่พอ (ต้องใช้ '+upMat(u)+')'};
  if(S.mo<upMo(u))return {ok:false,msg:'เงินไม่พอ'};
  return {ok:true,msg:''};
}
function upBuy(id){
  const u=UPG.find(x=>x.id===id);if(!u)return {ok:false,msg:'ไม่พบรายการ'};
  const c=upCan(u);if(!c.ok)return c;
  const p=upMo(u);
  S.inv.mat-=upMat(u);S.mo-=p;S.c.spent+=p;S.up[id]=1;S.sh.cond=Math.min(100,S.sh.cond+10);
  skillGain('build',2);
  S.log.push({d:S.day,t:'ปรับปรุงที่พัก: '+u.n,ok:true,g:'wealth',imp:2});
  return {ok:true,msg:'ติดตั้ง '+u.n+' แล้ว'};
}
function upLoseOnMove(o){
  const lost=UPG.filter(u=>u.fixed&&S.up[u.id]);
  if(!lost.length)return;
  lost.forEach(u=>delete S.up[u.id]);
  o.extra.push('ของที่ติดตั้งตายตัวต้องทิ้งไว้ที่เดิม: '+lost.map(u=>u.n).join(', ')+' (เตา แผงโซลาร์ ตู้ยา วิทยุ ขนไปด้วยได้)');
}

function homeDaily(d,o){
  if(!S.up)return;
  if(S.up.well&&S.wt<55&&RND()<.6){S.wt=Math.min(100,S.wt+22);if((S.upN|0)<4){S.upN=(S.upN|0)+1;o.extra.push('บ่อน้ำสำรองของคุณมีน้ำพอให้ดื่ม')}}
  if(S.up.garden){S.gd=(S.gd||0)+d/5.5;while(S.gd>=1){S.gd--;addStat('food',1,o);if(!S.gdn){S.gdn=1;o.extra.push('ผักในกระถางโตพอให้เก็บมากินได้แล้ว')}}}
  if(S.up.clinic){S.cl=(S.cl||0)+d/12;while(S.cl>=1){S.cl--;addStat('med',1,o)}}
  if(S.up.solar){S.en=Math.min(100,S.en+2*d);S.md=clamp(S.md+.05*d,0,100)}
  if(S.up.radio){S.ht=Math.max(0,S.ht-.25*d);if(S.crew.length)S.md=clamp(S.md+.03*d,0,100)}
  const hd=shHd();if(hd>0&&S.ht>0)S.ht=Math.max(0,S.ht-hd/400*d);
}
function skillDaily(d){
  const a=skLv('aid');
  if(a&&S.wd>0)S.wd=Math.max(0,S.wd-a*.2*d);
}

const GIFTK=['food','water','med','mat'],GIFT_KEY='doom365-gift';
function giftBox(){let b={};try{b=JSON.parse(lsGet(GIFT_KEY)||'{}')||{}}catch(e){}return b}
function giftApply(){
  try{
    const b=giftBox(),got=[];
    for(const k of GIFTK){const n=Math.min(6,b[k]|0);if(n>0){S.inv[k]+=n;got.push(ITEM_NAME[k]+' ×'+n)}}
    if(got.length){S.giftNote='ของฝากจากเพื่อน: '+got.join(', ');lsSet(GIFT_KEY,'')}
  }catch(e){}
}
function giftReceive(from,k,n){
  if(!GIFTK.includes(k))return false;n=Math.max(1,Math.min(2,n|0));
  const live=S&&S.role&&S.sh&&!['start','birth','ending','lobby'].includes(stage)&&!(MP.on&&MP.guest);
  if(live){
    if((S.giftIn|0)>=12)return false;
    S.giftIn=(S.giftIn|0)+n;S.inv[k]+=n;saveGame(true);try{renderHUD()}catch(e){}
  }else{
    const b=giftBox();if((b[k]|0)>=6)return false;
    b[k]=Math.min(6,(b[k]|0)+n);lsSet(GIFT_KEY,JSON.stringify(b));
  }
  toast('🎁 '+from+' ส่ง'+ITEM_NAME[k]+' ×'+n+' มาให้คุณ'+(live?'':' (เก็บไว้ให้ชีวิตหน้า)'));
  try{sfx('buy')}catch(e){}
  return true;
}

(function(){
  const COSTK=['hp','mo','en','food','water','med','mat','wt','fd'];
  function free(c){
    if(c.k||c.roll)return false;const x=c.x||{};let cost=0,gain=0;
    for(const k in x){const v=x[k];
      if(COSTK.includes(k)){if(v<0)cost++;if(v>0)gain++}
      else if(k==='md'||k==='lv'||k==='kar'||k==='ix'){if(v>0)gain++}
      else if(k==='wd'||k==='inf'||k==='ht'){if(v>0)cost++;if(v<0)gain++}}
    return cost===0&&gain>0;
  }
  let n=0;
  for(const t of TPL){
    if(!isThreat(t)||!t.ch)continue;
    for(const c of t.ch){
      if(!free(c))continue;
      c.k={p:.3,e:'run',x:{hp:-7,wd:12,md:-3},f:'ระหว่างที่คุณมัวทำอย่างนั้น อันตรายก็เข้ามาใกล้จนต้องวิ่งหนีสุดชีวิต และได้แผลมาหลายแห่ง'};
      c.x=Object.assign({},c.x,{en:(c.x.en||0)-6});
      if(c.x.mo>3000)c.x.mo=Math.round(c.x.mo*.5);
      n++;
    }
  }
  globalThis.__HARDENED=n;
})();

const RISKN={fight:'ต่อสู้',run:'วิ่งหนี',monster:'สัตว์ประหลาด',ghost:'สิ่งลี้ลับ',quake:'แผ่นดินไหว',flood:'น้ำท่วม',storm:'พายุ',steal:'โจรขโมย',fire:'ไฟไหม้',gas:'ก๊าซพิษ',cold:'อากาศหนาว',sick:'โรคระบาด',crowd:'ฝูงชน',trap:'กับดักและการซุ่มโจมตี'};
function gearUseText(k){
  const g=GEAR[k];if(!g||!g.b)return '';
  return Object.keys(g.b).filter(e=>RISKN[e]).map(e=>RISKN[e]+' −'+Math.round(g.b[e]*100)+'%').join(' · ');
}
/* ของที่มีอยู่ช่วยลดเสี่ยงของตัวเลือกนี้อย่างไร (หรือถ้ายังไม่มี ของอะไรที่ช่วยได้) */
function gearHint(e){
  const own=[];const g=S.gear||{};
  for(const k in g)if(g[k]&&GEAR[k]&&GEAR[k].b&&GEAR[k].b[e])own.push(GEAR[k].n);
  if(own.length)return {names:own,pct:Math.round(gearBonus(e)*100),tip:''};
  let tip='',bp=1e12;
  for(const k of SHOPK)if(GEAR[k].b&&GEAR[k].b[e]&&GEAR[k].p<bp){bp=GEAR[k].p;tip=GEAR[k].n}
  return {names:[],pct:0,tip};
}

function adjustShop(ev){
  try{
    if(!ev||!S.shop||!ev.ch)return;
    const ts=[];ev.ch.forEach(c=>{const t=c.risk&&c.risk.e;if(t&&t!=='run'&&RISKN[t]&&!ts.includes(t))ts.push(t)});
    if(!ts.length)return;
    const cand=SHOPK.filter(k=>!S.gear[k]&&!S.shop.g.includes(k)&&ts.some(t=>GEAR[k].b&&GEAR[k].b[t]));
    const add=shuffle(cand).slice(0,2);
    if(!add.length)return;
    const keep=S.shop.g.filter(k=>GEAR[k].b&&ts.some(t=>GEAR[k].b[t])).slice(0,2);
    const rest=S.shop.g.filter(k=>!keep.includes(k));
    const n=Math.max(S.shop.g.length,3);
    S.shop.g=keep.concat(add,rest).slice(0,Math.min(5,n+1));
    S.shop.hot=ts.map(t=>RISKN[t]).join(' · ');
    if(!S.shop.tag)S.shop.tag='วันนี้มีของรับมือ: '+S.shop.hot;
  }catch(x){}
}

function drawSky(t){

  const glow=(c,k)=>{g.globalAlpha=.1+.04*(3-k);D(cx,cy,r+3+k*4,c);g.globalAlpha=1};

/* ----- overlays ----- */
function overlays(t,tod,ap){
  const tint=tod==='night'?['#0a1030',.38]:tod==='dusk'?['#ff7a30',.12]:null;
  if(tint){g.globalAlpha=tint[1];R(0,0,W,H,tint[0]);g.globalAlpha=1}
  if(ap>.05){g.globalAlpha=ap*.2;R(0,0,W,H,'#ff3a10');g.globalAlpha=1}
  for(const l of LT){g.globalAlpha=tod==='day'?.35:.95;R(l[0],l[1],l[2],l[3],l[4]);g.globalAlpha=1}
  
  if(ap>.35){const n=Math.floor(ap*34);for(let i=0;i<n;i++){const e=view.embers[i%40];const x=((e.x+t*e.vx)%W+W)%W,y=(e.y+t*e.vy)%H;R(x,y,1+(e.c>.7?1:0),1,e.c>.5?'#ff9a3a':'#ffd36a')}}
  g.globalAlpha=.18;R(0,0,W,6,'#000');R(0,H-6,W,6,'#000');g.globalAlpha=1;
}

/* ----- frame loop ----- */
let lastF=0,dt0=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(ts-lastF<48)return;const dt=Math.min(.1,(ts-lastF)/1000);lastF=ts;
  const t=ts/1000,sc=SCN[view.scene],tod=view.tod,ap=clamp(view.day/365,0,1);
  LT=[];
  {const ap1=(view.day||0)>=350;if(ap1!==view.apocOn){view.apocOn=ap1;try{document.body.classList.toggle('apoc',ap1)}catch(e){}}}
  g.save();
  if(view.shake>0){const k=view.shake*3;g.translate(Math.round((Math.random()-.5)*2*k),Math.round((Math.random()-.5)*2*k));view.shake=Math.max(0,view.shake-dt*1.2)}
  if(view.day>335){const k=(view.day-335)/30;g.translate(Math.round((Math.random()-.5)*2*k),Math.round((Math.random()-.5)*2*k))}
  const indoor=INDOOR.includes(view.scene);
  if(!indoor){drawSky(t);drawDoom(t)}
  sc.draw(t,tod);
  if(typeof d3Shadows==='function'){try{d3Shadows(t,tod,sc.gy)}catch(e){}}
  if(typeof d3Crit==='function'){try{d3Crit(t,tod,sc.gy)}catch(e){}}
  if(view.scene==='room'&&view.up&&view.up.length&&typeof drawHome==='function')drawHome(t,tod);
  const gy=sc.gy;
  if(typeof monUpdate==='function'){try{monUpdate(t,dt,gy);monDraw(t,dt,gy,0)}catch(e){}}
  // npcs
  view.npcs.forEach((n,i)=>{const x=n.bx+Math.sin(t*n.sp+n.ph)*12,mv=Math.cos(t*n.sp+n.ph)*12*n.sp;person(x,gy-2+(i%2)*2,n.look,mv!==0&&(Math.floor(t*5+i)%2===0)&&Math.abs(mv)>1.2,x<view.px)});
  // player
  const dx=view.ptx-view.px;view.px+=Math.sign(dx)*Math.min(Math.abs(dx),60*dt);
  const moving=Math.abs(dx)>1;
  const ao=animOff(t);
  if(view.look)person(view.px+ao.dx,gy+(moving?0:Math.round(Math.sin(t*3)*.5))+ao.dy+(ao.sq?Math.round(ao.sq):0),view.look,(moving||ao.fr)&&Math.floor(t*8)%2===0,false);
  drawGhost(t,gy);
  drawAnimFx(t,gy,ao);
  drawCrew(t,gy);
  if(typeof drawPeers==='function')drawPeers(t,gy);
  if(typeof monDraw==='function'){try{monDraw(t,dt,gy,1)}catch(e){}}
  if(typeof detailFx==='function')detailFx(t,tod,gy);
  if(typeof apocFx==='function')apocFx(t,gy);
  overlays(t,tod,ap);
  if(typeof fx2Post==='function')fx2Post(t,tod,ap,gy,indoor);
  moodFx(t,view.mood);
  if(typeof lateFx==='function')lateFx(t);
  if(typeof monDraw==='function'){try{monDraw(t,dt,gy,2)}catch(e){}}
  endFx(t);
  g.restore();
  if(view.fade>0){view.fade=Math.max(0,view.fade-dt*2.2);const cols=W/16;for(let i=0;i<view.blocks.length&&i<cols*Math.floor(H/12)+0;i++){if(view.blocks[i]<view.fade)R((i%cols)*16,Math.floor(i/cols)*12,16,12,'#05070f')}}
  if(view.flash>0){g.globalAlpha=view.flash;R(0,0,W,H,'#fff');g.globalAlpha=1;view.flash=Math.max(0,view.flash-dt*3)}
}

function animOff(t){
  const a=view.anim;if(!a)return{dx:0,dy:0,fr:false,sq:0};
  const e=t-a.t0;if(e>2.2){view.anim=null;if(view.ptx>W)view.ptx=150;return{dx:0,dy:0,fr:false,sq:0}}
  let dx=0,dy=0,fr=false,sq=0;
  if(a.k==='fun'){dy=-Math.abs(Math.sin(e*9))*5;fr=Math.floor(e*8)%2===0}
  else if(a.k==='fight'){const ph=Math.sin(e*10);dx=a.ok?Math.max(0,ph)*6:-Math.max(0,ph)*6*(e>.8?1:0)-(e>.8?e*4:0);fr=Math.floor(e*12)%2===0}
  else if(a.k==='steal'){sq=e<1?2:0;dx=(a.ok&&e>1)?(e-1)*70:0;fr=Math.floor(e*10)%2===0}
  else if(a.k==='search'||a.k==='work'){sq=1;dy=Math.abs(Math.sin(e*6))*1;fr=Math.floor(e*6)%2===0}
  else if(a.k==='rest'){sq=2}
  else if(a.k==='scare'){dx=Math.sin(e*35)*1.2;dy=0}
  else if(a.k==='pray'){sq=1}

  else if(a.k==='dice'){fr=false}
  return{dx,dy,fr,sq};
}

/* เลือกท่าทางจากตัวเลือก */
function animKind(c){
  if(!c)return{k:'talk'};
  if(c.roll)return{k:'dice'};
  const x=c.x||{},g=c.g,e=c.risk&&c.raw&&c.raw.k&&c.raw.k.e;
  if(g==='crime')return{k:'steal'};
  if(e==='fight'||e==='monster')return{k:'fight'};
  if(e==='run'||e==='flood'||e==='quake')return{k:'run'};
  if(e==='ghost')return{k:'scare'};
  if(g==='faith')return{k:'pray'};
  if(g==='love'||g==='help')return{k:'love'};
  if(g==='fun')return{k:'fun'};
  if(x.mo>0)return{k:'money',up:true};
  if(x.mo<0)return{k:'money',up:false};
  if(x.hp>0||x.wd<0)return{k:'heal'};
  if(x.en>5)return{k:'rest'};
  return{k:'talk'};
}

  const col=tod==='night'?'#6a7aa8':tod==='dusk'?'#ffb28a':'#ffffff';
  const a=(tod==='night'?.16:.1)+.04*Math.sin(t*.4);
  band(gy-22,gy+6,col,col,a);
}
/* ฝนใหม่: เฉียง มีละอองกระเด็น */
function rainFx(t,tod,gy,fxTh){
  g.globalAlpha=.55;
  for(let i=0;i<90;i++){
    const sp=210+(i%5)*20,x=((hh(i,4)%(W+40))-t*55+W*10)%(W+40)-20,y=((hh(i,8)%H)+t*sp+i*7)%H;
    R(x,y,1,4,'#b8d0ff');if(y>gy+6&&y<gy+9)R(x-1,y,3,1,'#dbe8ff');
  }
  g.globalAlpha=1;
  g.globalAlpha=.1;R(0,0,W,H,'#102040');g.globalAlpha=1;
  if(tod==='night'||fxTh==='thunder'){const ph=(t*.33)%1;if(ph<.07){g.globalAlpha=(1-ph/.07)*.5;R(0,0,W,H,'#e6efff');g.globalAlpha=1}}
}
/* ---------- เอฟเฟกต์ตามมหันตภัย ---------- */
function bolt(x,y,len,col){
  g.strokeStyle=col;g.lineWidth=1.6;g.beginPath();g.moveTo(x,y);
  let cx=x,cy=y;const sd=(view.seed>>>0)+Math.floor(performance.now()/180);
  for(let i=0;i<9;i++){cx+=(hh(i,sd)%15)-7;cy+=len/9;g.lineTo(cx,cy)}
  g.stroke();
}

 boom(t,k,gy){
