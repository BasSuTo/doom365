/* ฟังก์ชันหลัง ใช้ท้ายเฟรม */
function fx2Post(t,tod,ap,gy,indoor){
  try{
    if(!indoor){sunRays(t,tod,ap);groundFog(t,tod,gy,ap)}
    ambientFx(t,tod,ap,indoor);
    if(typeof d3Front==='function')d3Front(t,tod,gy,indoor,ap);
    // แสงเรืองของหน้าต่าง โคมไฟ
    if(tod!=='day'||indoor){
      const a=tod==='night'?.55:tod==='dusk'?.4:.3;
      for(const l of LT){const ar=l[2]*l[3],cx=l[0]+l[2]/2,cy=l[1]+l[3]/2,r=Math.min(16,Math.max(8,Math.max(l[2],l[3])*1.4+5));glowAt(cx,cy,r,l[4]||'#ffd873',ar>260?a*.2:ar>60?a*.45:a)}
    }
    const th=fxTheme();
    if(view.rain&&!indoor)rainFx(t,tod,gy,th);
    if(th&&FX[th]&&!indoor){const k=Math.max(0,Math.min(1,(t-(view.t0||0))/1.4));FX[th](t,k,gy,ap)}
    g.globalAlpha=indoor?.5:.35;g.drawImage(vigCanvas(),0,0);g.globalAlpha=1;
  }catch(e){}
}
/* ===== รายละเอียดฉากรอบที่ 3: เงาใต้ตัวละคร สัตว์เล็ก หญ้าด้านหน้า แอ่งน้ำ ลำแสงในห้อง ฯลฯ ===== */
const D3_CRIT={street:['cat','pigeon'],alley:['cat','rat'],market:['pigeon','cat'],village:['chicken','dog'],farm:['chicken','dog'],park:['duck','pigeon','butterfly'],road:['dog'],beach:['crab','gull'],harbor:['gull','crab'],school:['pigeon'],temple:['pigeon','cat'],forest:['butterfly','deer'],mountain:['gull'],stall:['cat'],laundry:['cat'],station:['pigeon'],bridge:['gull'],cemetery:['cat'],checkpoint:['dog'],base:['dog'],dojo:['cat']};
const D3_FRONT=['street','village','market','park','farm','road','beach','forest','temple','cemetery','school','alley','harbor','mountain','bridge','station','stall','base','checkpoint','laundry','dojo'];
function d3rng(i,s){return ((hh(i*7+3,(s|0)+11)%1000)/1000)}
function sprite(kind,x,y,t,face,col,seed){
  x=Math.round(x);y=Math.round(y);const f=face>0?1:-1,fl=Math.floor(t*6+seed)%2;
  const P=(dx,dy,w,h,c)=>R(x+dx*f-(f<0?w-1:0),y+dy,w,h,c);
  if(kind==='cat'){const c=col||'#4a3a30',c2='#2a2018';
    P(0,-3,5,3,c);P(4,-5,3,3,c);P(4,-6,1,1,c2);P(6,-6,1,1,c2);P(6,-4,1,1,'#ffe08a');P(-1,-5-(fl?0:1),1,3,c);P(-1,-6-(fl?0:1),1,1,c);P(0,0,1,1,c2);P(3,0,1,1,c2);if(fl){P(1,0,1,1,c2)}}
  else if(kind==='dog'){const c=col||'#9a7a50';P(0,-4,7,3,c);P(6,-6,3,3,c);P(8,-4,1,1,'#2a2018');P(6,-7,1,2,'#6a4a30');P(-1,-5,1,2,c);P(0,-1,1,2,c);P(2,-1,1,2,c);P(5,-1,1,2,c);P(6,-1,1,2,c);P(8,-5,1,1,'#2a2018')}
  else if(kind==='pigeon'){const c=col||'#8a8a98';P(0,-3,4,2,c);P(3,-5,2,2,c);P(5,-4,1,1,'#e8a838');P(1,-1,1,1,'#e8a838');P(3,-1,1,1,'#e8a838');P(0,-4,1,1,'#6a6a78');P(3,-4,1,1,'#2a2a38')}
  else if(kind==='chicken'){P(0,-4,4,3,'#f4ecd8');P(3,-6,2,3,'#f4ecd8');P(3,-7,1,1,'#d9342a');P(5,-5,1,1,'#e8a838');P(-1,-5,2,2,'#d8c8a8');P(1,-1,1,2,'#e8a838');P(3,-1,1,2,'#e8a838')}
  else if(kind==='duck'){P(0,-2,5,2,'#f4f4f4');P(4,-4,2,2,'#2a7a4a');P(6,-3,1,1,'#f0a020');P(-1,-3,1,1,'#f4f4f4')}
  else if(kind==='rat'){P(0,-2,4,2,'#6a6058');P(4,-2,2,1,'#6a6058');P(6,-2,1,1,'#2a2018');P(-3,-1,3,1,'#8a7068')}
  else if(kind==='crab'){P(0,-2,4,2,'#d9533a');P(-1,-3,1,1,'#d9533a');P(4,-3,1,1,'#d9533a');P(0,0,1,1,'#b9432a');P(3,0,1,1,'#b9432a')}
  else if(kind==='gull'){const up=fl?-1:0;P(0,-2+up,3,1,'#f4f4f4');P(-3,-3+up,3,1,'#f4f4f4');P(3,-3+up,3,1,'#f4f4f4');P(5,-2+up,1,1,'#f0a020')}
  else if(kind==='butterfly'){const o=fl?1:0;P(0,0,1,1,'#2a2018');P(-1-o,-1,1+o,1,col||'#f08ac0');P(1,-1,1+o,1,col||'#f08ac0')}
  else if(kind==='deer'){P(0,-6,6,3,'#a87a50');P(6,-9,2,3,'#a87a50');P(6,-10,1,1,'#6a4a30');P(8,-10,1,1,'#6a4a30');P(0,-3,1,3,'#8a5a30');P(5,-3,1,3,'#8a5a30');P(-1,-6,1,1,'#f4ecd8')}
}
function d3Crit(t,tod,gy){
  const sc=view.scene;if(INDOOR.includes(sc)||tod==='night'&&sc!=='cemetery'&&sc!=='alley')return;
  const kinds=D3_CRIT[sc];if(!kinds)return;
  const sd=view.seed|0;
  const n=Math.min(2,1+(sd%3===0?1:0));
  for(let i=0;i<n;i++){
    const kind=kinds[(hh(i,sd)%kinds.length)],sp=kind==='gull'?18:kind==='butterfly'?10:kind==='dog'?9:kind==='cat'?6:kind==='deer'?4:7;
    const ph=d3rng(i,sd)*40,per=(kind==='cat'||kind==='dog'||kind==='deer')?9:5,cyc=(t*.14+ph)%1;
    // เดินไปกลับ มีช่วงหยุด
    const seg=cyc<.45?cyc/.45:cyc<.55?1:cyc<1?1-(cyc-.55)/.45:0,moving=cyc<.45||cyc>.55;
    const x=30+seg*(W-80)*(.4+d3rng(i+3,sd)*.6)+i*70,face=(cyc<.5)?1:-1;
    let y=gy+2+(i*3)+(kind==='butterfly'?-18-Math.sin(t*2+i)*8:0);
    if(kind==='gull'){y=60+Math.sin(t*1.2+i)*10;}
    if(kind==='butterfly'){const fx=x+Math.sin(t*1.1+i*2)*14;sprite(kind,fx,y,t,face,i%2?'#f08ac0':'#ffd84a',i);continue}
    if(kind!=='gull'&&kind!=='butterfly'){g.globalAlpha=.28;R(x-1,y,7,1,'#000');g.globalAlpha=1}
    sprite(kind,x,y,moving?t:0,face,undefined,i);
  }
}
/* เงาใต้ตัวละคร (วาดก่อนตัวละคร) */
function d3Shadows(t,tod,gy){
  const sh=(x,y,w)=>{g.globalAlpha=tod==='night'?.18:.3;g.fillStyle='#000';g.beginPath();g.ellipse(Math.round(x),Math.round(y),w,w*.28,0,0,Math.PI*2);g.fill();g.globalAlpha=1};
  view.npcs.forEach((n,i)=>{const x=n.bx+Math.sin(t*n.sp+n.ph)*12;sh(x+4,gy-2+(i%2)*2+8,6)});
  sh(view.px+4,gy+8,7);
}
/* ด้านหน้าสุด: หญ้า ขอบมืด แอ่งน้ำ ลำแสงในห้อง */
function d3Front(t,tod,gy,indoor,ap){
  const sc=view.scene,sd=view.seed|0,night=tod==='night';
  if(!indoor&&D3_FRONT.includes(sc)){
    const base=night?'#06120c':tod==='dusk'?'#14200e':'#2e5a28',tip=night?'#0b1d12':tod==='dusk'?'#2a3a16':'#4e8a38';
    for(let x=-4;x<W+4;x+=5){
      const h=3+hh(x,sd)%5,sw=Math.round(Math.sin(t*1.6+x*.31)*1.4);
      R(x,H-h,1,h,base);R(x+sw,H-h-1,1,2,tip);if(hh(x,sd+1)%4===0)R(x+1+sw,H-h-2,1,1,tip);
    }
    R(0,H-2,W,2,base);
    if(view.rain){
      // แอ่งน้ำ + วงน้ำกระเพื่อม
      for(let i=0;i<3;i++){const px=60+i*90+(hh(i,sd)%20),py=gy+8+i*3;g.globalAlpha=.4;g.fillStyle=night?'#2a3a6a':'#7aa8d8';g.beginPath();g.ellipse(px,py,16,3,0,0,Math.PI*2);g.fill();g.globalAlpha=1;
        const r=((t*1.5+i*.4)%1)*9;g.strokeStyle='rgba(255,255,255,'+(.6*(1-r/9))+')';g.lineWidth=.8;g.beginPath();g.ellipse(px+Math.sin(i*5)*4,py,r*1.5,r*.4,0,0,Math.PI*2);g.stroke()}
    }
  }
  if(indoor&&!night&&sc!=='jail'&&sc!=='bunker'){
    // ลำแสงแดดจากหน้าต่างมีฝุ่นลอย
    g.globalCompositeOperation='lighter';
    const gr=g.createLinearGradient(40,0,160,150);gr.addColorStop(0,'rgba(255,236,180,.22)');gr.addColorStop(1,'rgba(255,236,180,0)');
    g.fillStyle=gr;g.beginPath();g.moveTo(30,10);g.lineTo(90,10);g.lineTo(190,150);g.lineTo(90,150);g.closePath();g.fill();
    g.globalCompositeOperation='source-over';
    for(let i=0;i<16;i++){const q=(t*.06+i*.0625)%1,x=45+q*110+Math.sin(t+i)*5,y=14+q*130;const a=.4+.4*Math.sin(t*1.2+i);g.globalAlpha=a;R(x,y,1,1,'#fff6d0');g.globalAlpha=1}
  }
  if(indoor&&night&&sc!=='jail'){
    // แสงหน้าจอ/โคมไฟอุ่นที่พื้น
    g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(190,gy+10,2,190,gy+10,70);gr.addColorStop(0,'rgba(255,190,110,.18)');gr.addColorStop(1,'rgba(255,190,110,0)');g.fillStyle=gr;g.fillRect(100,gy-60,180,100);g.globalCompositeOperation='source-over';
  }
  // ขอบหนังสือ/วิกเนตสี่มุมแบบเลนส์
  g.globalAlpha=.12;g.fillStyle='#000';g.fillRect(0,0,W,2);g.fillRect(0,H-2,W,2);g.globalAlpha=1;
}
/* ===== เสียงตามอารมณ์ฉาก (WebAudio ล้วน ไม่มีไฟล์เสียง) ===== */
let ac=null,musicOn=false,master=null,fxbus=null,chan='m',CH={},mTimer=null,mStep=0,noiseBuf=null,curMood='calm';
const SEMI=n=>Math.pow(2,n/12);
const MINOR=[0,2,3,5,7,8,10],MAJOR=[0,2,4,5,7,9,11],PENT=[0,2,4,7,9],MINP=[0,3,5,7,10];
function initAudio(){
  if(ac)return true;
  try{

    applyVol();

function note(f,dur,type,vol,when,o){

  if(o.vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=5.5;lg.gain.value=f*.012;l.connect(lg);lg.connect(osc.frequency);l.start(t0);l.stop(t0+dur+.1)}
  if(o.slide)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t0+dur);
  const atk=o.atk||.01;
  gn.gain.setValueAtTime(.0001,t0);gn.gain.linearRampToValueAtTime(vol,t0+atk);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  let out=gn;
  if(o.lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;osc.connect(fl);fl.connect(gn)}else osc.connect(gn);
  out.connect(o.dry?CH[chan].dry:CH[chan].fx);
  osc.start(t0);osc.stop(t0+dur+.05);
}
function noise(dur,vol,when,hp,lp){

  if(lp){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;n.connect(f);n=f}
  n.connect(gn);gn.connect(CH[chan].dry);s.start(t0);s.stop(t0+dur+.05);
}

  function pref(){try{return localStorage.getItem(MUPREF)}catch(e){return null}}

  function go(e){
    if(pref()==='off'){stop();return}

      if(!musicOn){toggleMusic()}

      if(musicOn&&ac){
        if(ac.state==='running')stop();
        else ac.resume().then(()=>{if(ac.state==='running')stop()}).catch(()=>{});

    }catch(x){}

  evs.forEach(n=>document.addEventListener(n,go,true));
})();

function lobbyPresence(){
  if(!MP.api)return;
  const st=MP.on?(MP.host?'หัวหน้าห้อง':'ผู้ช่วยในห้อง'):stage==='play'||stage==='morning'?'กำลังเล่นวันที่ '+(S?Math.floor(S.day)+1:'-'):stage==='ending'?'ดูตอนจบ':stage==='board'?'ดูอันดับ':'อยู่หน้าแรก';
  const p={nm:NICK||'ผู้เล่น',st:st+(S&&S.role&&stage!=='start'?' · '+S.role.n:''),rc:MP.on&&MP.host?MP.code:null,pk:peakN()};
  try{MP.api.presence(p).catch(()=>{})}catch(e){}
}
const PEAKK='doom365-peak';
function peakN(){try{return Math.min(5000,Math.max(0,parseInt(localStorage.getItem(PEAKK))||0))}catch(e){return 0}}
function peakSet(v){try{if(v>peakN())localStorage.setItem(PEAKK,String(Math.round(v)))}catch(e){}}
function updOnc(){
  const el=$('onc');if(!el)return;
  if(!MP.api||typeof MP.api.peers!=='function'){el.style.display='none';return}
  let n=0;try{n=MP.api.peers().filter(p=>p.kind==='viewer').length}catch(e){}
  const conn=!(window.D365_SA&&MP.api.connected&&!MP.api.connected());
  el.style.display='';
  if(!conn){el.className='onc off';el.textContent='⚪ กำลังเชื่อมต่อออนไลน์…';return}
  n=Math.max(1,n);
  try{MP.api.peers().forEach(p=>{const v=p.presence&&+p.presence.pk;if(v>0&&v<=5000)peakSet(v)})}catch(e){}
  peakSet(n);
  const pk=peakN();
  el.className='onc';el.textContent='🟢 ออนไลน์ '+n+' คน · สูงสุดที่เคยมี '+Math.max(pk,n)+' คน';
}
let onlUnsub=null;
function lobbyInit(){
  if(!MP.api||onlUnsub||typeof MP.api.onPeers!=='function')return;
  try{onlUnsub=MP.api.onPeers(()=>{renderOnline();updOnc()})}catch(e){}
  try{giftInit()}catch(e){}
  try{if(typeof MP.api.onConnection==='function')MP.api.onConnection(()=>{renderOnline();updOnc()})}catch(e){}
  lobbyPresence();updOnc();
}

function achEnding(E,kind){
  const box=$('achbox');if(!box)return;
  if(S.cause==='giveup'){box.innerHTML='';return}
  const got=lsj(ACHK,{}),meta=lsj(METAK,{deaths:[],roles:[]});
  if(kind==='died'&&S.cause&&!meta.deaths.includes(S.cause))meta.deaths.push(S.cause);
  if(!meta.roles.includes(S.role.n))meta.roles.push(S.role.n);
  const fresh=[];
  for(const a of ACH){if(got[a.id])continue;let ok=false;try{ok=a.c(E,kind,meta)}catch(e){}if(ok){got[a.id]=Date.now();fresh.push(a)}}
  lsw(ACHK,got);lsw(METAK,meta);
  if(fresh.length){box.innerHTML='<div class="achnew"><small style="color:var(--muted)">ปลดล็อกเหรียญใหม่</small>'+fresh.map(a=>'<div class="ach" style="border:0;padding:4px 0"><i>'+a.i+'</i><span><b>'+esc(a.n)+'</b><small>'+esc(a.d)+'</small></span></div>').join('')+'</div>';sfx('finale')}
}

  if(!S||S.cause==='giveup')return;
  const own=GEARK.filter(k=>S.gear[k]&&!GEAR[k].legend);

function applyLegacy(){
  const l=lsj(LEGK,null);if(!l)return;

/* ===== v11: สมุดภาพชีวิต + บันทึกท้าทายสัปดาห์ ===== */
let ALBUM=[];
const albumReset=()=>{ALBUM=[]};
function albumShot(label){
  try{
    const cv=document.getElementById('cv');if(!cv||ALBUM.length>=14)return;
    ALBUM.push({d:Math.floor(S.day)+1,lab:String(label||'').slice(0,50),img:cv.toDataURL('image/jpeg',.72)});
  }catch(e){}
}
function albumPick(){
  const a=ALBUM.slice();if(a.length<=6)return a;
  const out=[a[0]];for(let i=1;i<5;i++)out.push(a[Math.round(i*(a.length-1)/5)]);out.push(a[a.length-1]);
  return out.filter((x,i,r)=>r.indexOf(x)===i);
}
function albumRender(boxId){
  const box=document.getElementById(boxId);if(!box)return;
  const a=albumPick();if(!a.length){box.innerHTML='';return}
  box.innerHTML='<p class="hint" style="margin:6px 0">สมุดภาพชีวิต · ฉากสำคัญจากปีนี้</p><div class="album">'+a.map(x=>'<figure><img alt="" src="'+x.img+'"><figcaption>วันที่ '+x.d+' · '+esc(x.lab)+'</figcaption></figure>').join('')+'</div><div class="row"><button class="btn ghost" id="albsave">บันทึกสมุดภาพเป็นรูป</button></div>';
  const btn=document.getElementById('albsave');
  if(btn)btn.onclick=async()=>{
    try{
      const cols=2,rows=Math.ceil(a.length/cols),cw=320,ch=180,pad=10,cap=22;
      const c=document.createElement('canvas');c.width=cols*(cw+pad)+pad;c.height=rows*(ch+cap+pad)+pad+30;
      const x=c.getContext('2d');x.fillStyle='#120a1f';x.fillRect(0,0,c.width,c.height);
      x.fillStyle='#a6fff0';x.font='bold 16px sans-serif';x.fillText('สมุดภาพชีวิต · '+(S&&S.role?S.role.n:''),pad,22);
      await Promise.all(a.map((p,i)=>new Promise(res=>{const im=new Image();im.onload=()=>{const cx=pad+(i%cols)*(cw+pad),cy=30+pad+Math.floor(i/cols)*(ch+cap+pad);x.drawImage(im,cx,cy,cw,ch);x.fillStyle='#f5f0ff';x.font='12px sans-serif';x.fillText('วันที่ '+p.d+' · '+p.lab.slice(0,34),cx,cy+ch+15);res()};im.onerror=res;im.src=p.img})));
      const url=c.toDataURL('image/png');
      let done=false;
      try{const d=await claude.use('downloads');if(d){await d.save({filename:'album.png',data:await (await fetch(url)).blob()});done=true}}catch(e){}
      if(!done){const l=document.createElement('a');l.href=url;l.download='album.png';document.body.appendChild(l);l.click();l.remove()}
    }catch(e){toast('บันทึกรูปไม่สำเร็จ')}
  };
}

const icoCache={};
function ICO(k){
  if(icoCache[k])return icoCache[k];
  const c=document.createElement('canvas');c.width=7;c.height=7;const x=c.getContext('2d');x.fillStyle=ICOL[k];
  PIX[k].forEach((row,y)=>{for(let i=0;i<row.length;i++)if(row[i]==='X')x.fillRect(i,y,1,1)});
  return icoCache[k]=c.toDataURL();
}

  if(INVL.includes(k))return '<span class="chip '+(v>0?'up':'neu')+'" title="'+LABEL[k]+'">'+ic(k)+(v>0?'+':'-')+Math.abs(v)+'</span>';
  const bad=BADUP.includes(k)?v>0:v<0;
  return '<span class="chip '+(bad?'dn':'up')+'" title="'+LABEL[k]+'">'+ic(k)+(v>0?'+':'-')+(k==='mo'?fmt(Math.abs(v)):Math.abs(v))+'</span>';

function statsHTML(h){
  const kc=(typeof karChip==='function'&&h.kr!=null)?'<span class="sep"></span>'+karChip(h.kr):'';

}
function statsHTML0(h){
  if(HUDALL)return bar('hp',h.hp,h.hp<30)+bar('md',h.md,h.md<30)+bar('lv',h.lv,h.lv<15)+bar('ht',h.ht,h.ht>50)+'<span class="sep"></span>'+bar('fd',h.fd,h.fd<30)+bar('wt',h.wt,h.wt<30)+bar('en',h.en,h.en<25);
  let s=bar('hp',h.hp,h.hp<30)+comboBar(h.fd,h.wt)+bar('en',h.en,h.en<25);
  if(h.md<45)s+=bar('md',h.md,h.md<30);
  if(h.lv<25)s+=bar('lv',h.lv,h.lv<15);
  if(h.ht>25)s+=bar('ht',h.ht,h.ht>50);

function needOf(h){
  if(!h||h.hp==null)return '';
  const inv=h.inv||{};
  if(h.hp<25)return 'สุขภาพต่ำมาก พักผ่อนหรือใช้ยาเดี๋ยวนี้';
  if(h.inf>15)return 'แผลติดเชื้อ ใช้ยาหรือไปหาหมอ (ปุ่ม ดูแลตัวเอง / ตลาดมืด)';
  if(h.fd<45&&(inv.food||0)<=0)return 'อาหารหมด หาซื้อหรือหาของกินด่วน';
  if(h.wt<45&&(inv.water||0)<=0)return 'น้ำหมด หาซื้อหรือหาน้ำสะอาดด่วน';
  if(h.wd>25)return 'แผลลึก ควรพันแผลหรือใช้ยา';
  if(h.en<25)return 'เหนื่อยมาก ควรพักผ่อนก่อน';
  if(h.ht>60)return 'ตำรวจกำลังตามล่า ระวังตัวให้ดี';
  if(h.mo<0)return 'เงินติดลบ ใจจะแย่ลงทุกวัน';
  return '';
}

function floaters(d){
  const box=$('floaters');
  for(const k of KEYS){
    if(!d[k])continue;
    const bad=BADUP.includes(k)?d[k]>0:d[k]<0;
    const e=document.createElement('div');e.className='fl '+(bad?'dn':'up');
    e.innerHTML=ic(k)+(d[k]>0?'+':'-')+(k==='mo'?fmt(Math.abs(d[k])):Math.abs(d[k]));
    box.appendChild(e);setTimeout(()=>e.remove(),2300);

}

const MP={room:null,api:null,on:false,host:false,guest:false,code:'',nick:'',rev:0,sid:0,last:null,votes:{},rx:null,grev:-1,unsub:[],auto:false,hostPeer:null,tally:null,ready:false,tried:false,iv:null};
const TOPICS={st:'interact',vote:'interact',chat:'interact',hello:'interact',tally:'interact',emo:'interact',pick:'interact',next:'interact'};
(async function(){
  try{
    if(window.claude&&claude.use){
      const r=await claude.use('room');

    }
  }catch(e){}

  try{lobbyInit()}catch(e){}
})();
const b64=u8=>{let s='';for(let i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s)};
const unb64=t=>{const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
function mpSend(model,keep){
  if(!MP.on||!MP.host||!MP.room)return;
  if(MP.lead&&!leadValid())MP.lead='host';
  model.lead=leadInfo();
  if(keep!==false){model.rev=++MP.rev;MP.last=model}
  const bytes=new TextEncoder().encode(JSON.stringify(model)),CH=2300,n=Math.ceil(bytes.length/CH),id=++MP.sid;
  for(let i=0;i<n;i++)MP.room.emit('st',{id,i,n,d:b64(bytes.slice(i*CH,(i+1)*CH))}).catch(()=>{});
}
function nameOf(peer){
  const p=MP.room&&MP.room.peers().find(x=>x.peer===peer);
  return clean(p&&p.presence&&p.presence.nm,16)||'เพื่อน';
}
function peerList(){
  if(!MP.room)return [];
  return MP.room.peers().filter(p=>p.kind==='viewer');
}
function guests(){return peerList().filter(p=>!(p.presence&&p.presence.host===1)&&!p.sameTab)}
function renderPlayers(){
  const el=$('plist');if(!el)return;
  el.innerHTML=peerList().map(p=>'<span>'+esc(clean(p.presence&&p.presence.nm,16)||'เพื่อน')+(p.presence&&p.presence.host===1?' (หัวหน้า)':'')+(p.sameTab?' (คุณ)':'')+'</span>').join('');
  $('chatwho').textContent=peerList().length+' คนในห้อง';
}
function chatLine(name,text,sys){
  const log=$('clog');if(!log)return;
  const p=document.createElement('p');
  if(sys){p.className='sys';p.textContent=text}
  else{const b=document.createElement('b');b.textContent=name;p.appendChild(b);p.appendChild(document.createTextNode(text))}
  log.appendChild(p);while(log.children.length>60)log.removeChild(log.firstChild);log.scrollTop=log.scrollHeight;
}
async function mpOpen(code,nick,asHost){
  if(!MP.api){toast('เปิดโหมดออนไลน์ไม่ได้ในหน้านี้');return false}
  try{
    MP.room=await MP.api.join('d365-'+code);
  }catch(e){toast('เข้าห้องไม่สำเร็จ ลองใหม่อีกครั้ง');return false}
  Object.assign(MP,{on:true,host:asHost,guest:!asHost,code,nick,rev:0,votes:{},grev:-1,rx:null,last:null,tally:null,lead:null,turns:true,glead:null});
  const r=MP.room;
  r.presence({nm:nick,host:asHost?1:0});
  MP.unsub.push(r.onPeers(c=>{
    renderPlayers();
    for(const p of c.joined)if(!p.sameTab&&MP.host){chatLine('',nameOf(p.peer)+' เข้าห้องแล้ว',true);if(MP.last)mpSend(MP.last,false);sfx('crew')}
    for(const p of c.left){if(!p.sameTab){chatLine('',nameOf(p.peer)+' ออกจากห้อง',true);if(MP.host){delete MP.votes[p.peer];mpTally()}}}
    if(MP.guest){const h=peerList().find(x=>x.presence&&x.presence.host===1);MP.hostPeer=h?h.peer:null}
  }));
  MP.unsub.push(r.on('hello',m=>{if(MP.host&&!m.sameTab&&MP.last)mpSend(MP.last,false)}));
  MP.unsub.push(r.on('emo',m=>{const d=m.data||{};emoPop(String(d.e||''));if(!m.sameTab)sfx('chat')}));
  MP.pv=setInterval(()=>{view.peers=peersForView()},700);
  MP.unsub.push(r.on('chat',m=>{
    const d=m.data||{};const t=clean(d.m,160);if(!t)return;
    chatLine(m.sameTab?'คุณ':nameOf(m.peer),t);if(!m.sameTab)sfx('chat');
  }));
  if(asHost){
    MP.unsub.push(r.on('vote',m=>{
      const d=m.data||{};
      if(m.sameTab||d.rev!==MP.rev||!MP.last||!MP.last.vote)return;
      const i=+d.i;if(!(i>=0&&i<MP.last.vote.n)||MP.last.vote.off&&MP.last.vote.off.includes(i))return;
      MP.votes[m.peer]=i;mpTally();sfx('vote');
      if(MP.auto)mpAutoCheck();
    }));
    MP.unsub.push(r.on('pick',m=>{
      const d=m.data||{};
      if(m.sameTab||!MP.last||d.rev!==MP.rev||m.peer!==MP.lead||busy||!MP.last.vote)return;
      const i=+d.i;if(!(i>=0&&i<MP.last.vote.n)||(MP.last.vote.off&&MP.last.vote.off.includes(i)))return;
      hostPickIndex(i);
    }));
    MP.unsub.push(r.on('next',m=>{
      const d=m.data||{};
      if(m.sameTab||!MP.last||d.rev!==MP.rev||m.peer!==MP.lead)return;
      const nx=$('next');if(nx)nx.click();
    }));
    MP.iv=setInterval(()=>{if(MP.last)mpSend(MP.last,false)},7000);
  }else{
    MP.unsub.push(r.on('st',m=>{
      if(!MP.hostPeer||m.peer!==MP.hostPeer)return;
      const d=m.data||{};
      if(!d||typeof d.d!=='string'||!(d.n>=1&&d.n<=40)||!(d.i>=0&&d.i<d.n))return;
      if(!MP.rx||MP.rx.id!==d.id){MP.rx={id:d.id,n:d.n,parts:[],got:0}}
      if(!MP.rx.parts[d.i]){MP.rx.parts[d.i]=d.d;MP.rx.got++}
      if(MP.rx.got===MP.rx.n){
        try{
          const total=MP.rx.parts.map(unb64);let len=0;total.forEach(u=>len+=u.length);
          const all=new Uint8Array(len);let o=0;total.forEach(u=>{all.set(u,o);o+=u.length});
          const model=JSON.parse(new TextDecoder().decode(all));
          MP.rx=null;if(model&&typeof model==='object')guestRender(model);
        }catch(e){MP.rx=null}
      }
    }));
    MP.unsub.push(r.on('tally',m=>{
      if(m.peer!==MP.hostPeer)return;const d=m.data||{};
      if(d.rev!==MP.grev||!Array.isArray(d.c))return;
      MP.tally=d;guestTally();
    }));
    setTimeout(()=>{r.emit('hello',{}).catch(()=>{})},500);
    MP.hi=setInterval(()=>{if(MP.grev<0)r.emit('hello',{}).catch(()=>{})},3000);
  }
  $('chatbox').style.display='grid';renderPlayers();
  chatLine('','เข้าห้อง '+code.toUpperCase()+' แล้ว พิมพ์คุยกันได้เลย',true);
  return true;
}
function mpClose(){
  MP.unsub.forEach(u=>{try{u()}catch(e){}});MP.unsub=[];
  clearInterval(MP.iv);clearInterval(MP.hi);clearInterval(MP.pv);view.peers=[];
  if(MP.room){try{MP.room.leave()}catch(e){}}
  Object.assign(MP,{room:null,on:false,host:false,guest:false,last:null,votes:{},tally:null,rx:null,grev:-1,lead:null,glead:null});
  $('chatbox').style.display='none';
}
/* ----- ผลัดกันนำ: คนที่ถึงตาเป็นผู้ตัดสิน คนอื่นโหวตแนะนำ ----- */
function selfPeer(){const p=MP.room&&MP.room.peers().find(x=>x.sameTab);return p?p.peer:null}
function leadValid(){return !MP.lead||MP.lead==='host'||guests().some(p=>p.peer===MP.lead)}
function leadName(){return !MP.lead||MP.lead==='host'?(MP.nick||'หัวหน้าห้อง'):nameOf(MP.lead)}
function rotateLead(){
  if(!MP.on||!MP.host)return;
  if(!MP.turns){MP.lead='host';return}
  const ord=['host'].concat(guests().map(p=>p.peer));
  const i=ord.indexOf(MP.lead);MP.lead=ord[(i+1)%ord.length]||'host';
  if(ord.length>1)chatLine('','ตานี้ '+leadName()+' เป็นคนตัดสินใจ (คนอื่นโหวตแนะนำได้)',true);
}
function leadInfo(){const ord=['host'].concat(guests().map(p=>p.peer));return {p:MP.lead,n:leadName(),o:ord.map(x=>x==='host'?(MP.nick||'หัวหน้าห้อง'):nameOf(x)).slice(0,8),i:Math.max(0,ord.indexOf(MP.lead||'host'))}}
function turnStrip(o,i){
  if(!Array.isArray(o)||o.length<2)return '';
  return '<div class="tstrip" style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:0 0 8px;font-size:12.5px">'+o.map((n,k)=>
   '<span style="padding:2px 9px;border-radius:12px;border:1px solid var(--line);'+(k===i?'background:var(--gold);color:#1a0d00;font-weight:700':'opacity:.75')+'">'+(k===i?'🎯 ':'')+esc(clean(n,14))+(k===(i+1)%o.length&&k!==i?' · ถัดไป':'')+'</span>').join('<span style="opacity:.5">→</span>')+'</div>';
}
function hostIsLead(){return !(MP.on&&MP.host)||MP.lead==='host'||!leadValid()}
function hostClick(i){
  if(hostIsLead()){hostPickIndex(i);return}
  MP.votes.host=i;mpTally();sfx('vote');toast('โหวตแนะนำให้ '+leadName()+' แล้ว');
}
function mpTally(){
  if(!MP.on||!MP.host||!MP.last||!MP.last.vote)return;
  const n=MP.last.vote.n,c=Array(n).fill(0);
  for(const p in MP.votes)if(MP.votes[p]<n)c[MP.votes[p]]++;
  MP.tally={rev:MP.rev,c};
  MP.room.emit('tally',{rev:MP.rev,c}).catch(()=>{});
  hostTally();
}
function leader(){
  const c=MP.tally&&MP.tally.c;if(!c)return -1;
  const off=(MP.last&&MP.last.vote&&MP.last.vote.off)||[];
  let m=0;c.forEach((v,i)=>{if(!off.includes(i))m=Math.max(m,v)});
  if(!m)return -1;
  const ties=c.map((v,i)=>v===m&&!off.includes(i)?i:-1).filter(i=>i>=0);
  return pick(ties);
}
function mpAutoCheck(){
  const gs=guests();if(!gs.length)return;
  const voted=gs.filter(p=>MP.votes[p.peer]!=null).length;
  if(voted>=gs.length&&!busy){const i=leader();if(i>=0)hostPickIndex(i)}
}
function hostPickIndex(i){
  if(stage==='play'&&ev)choose(i);
  else if(stage==='morning')morningPick(i);
}
function hostTally(){
  const c=MP.tally&&MP.tally.c;
  panel.querySelectorAll('[data-vi]').forEach(b=>{
    const i=+b.dataset.vi;let v=b.querySelector('.vb');
    const n=c?c[i]||0:0;
    if(n){if(!v){v=document.createElement('span');v.className='vb';b.appendChild(v)}v.textContent=n+' โหวต'}else if(v)v.remove();
    b.classList.toggle('voted',!!c&&n>0&&n===Math.max(...c));
  });
  const lb=$('useVote');if(lb){const i=leader();lb.disabled=i<0;lb.textContent=i<0?'ยังไม่มีใครโหวต':'ใช้ข้อที่เพื่อนโหวตนำ (ข้อ '+(i+1)+')'}
}
function guestTally(){
  const c=MP.tally&&MP.tally.c;
  panel.querySelectorAll('[data-vi]').forEach(b=>{
    const i=+b.dataset.vi;let v=b.querySelector('.vb');const n=c?c[i]||0:0;
    if(n){if(!v){v=document.createElement('span');v.className='vb';b.appendChild(v)}v.textContent=n+' โหวต'}else if(v)v.remove();
    b.classList.toggle('voted',MP.myVote===i);
  });
}

function chipsOf(c){
  let ch=chipsFor(c.x);
  if(c.dice)ch+='<span class="chip neu txt">ทอยลูกเต๋า ลุ้นผล</span>';
  else ch+='<span class="chip neu">'+ic('d')+c.d+' วัน</span>';
  if(c.p&&RISKMODE!=='off')ch+='<span class="chip rk txt">'+(RISKMODE==='txt'?riskWord(c.p):'เสี่ยงพลาด ~'+Math.round(c.p*100)+'%')+'</span>';
  if(c.p&&c.gh&&RISKMODE!=='off'){
    if(c.gh.n&&c.gh.n.length)ch+='<span class="chip up txt">🎒 '+esc(c.gh.n.join(', '))+' ช่วยลดเสี่ยง ~'+c.gh.pc+'%</span>';
    else if(c.gh.tp)ch+='<span class="chip neu txt">🎒 ของที่ช่วยได้: '+esc(c.gh.tp)+' (ตลาดมืด)</span>';
  }
  if(!c.ok)ch+='<span class="chip dn txt">เงินหรือของไม่พอ</span>';
  return ch;
}

const MGK='doom365-mg';
function mgOn(){return false} /* ถอดมินิเกมจับจังหวะออกแล้ว: ผลเสี่ยงขึ้นกับโชคตามเปอร์เซ็นต์ล้วนๆ */
function mgPlay(c,done){
  const ov=document.createElement('div');ov.className='ov';
  const zw=.2+(1-Math.min(.9,c.risk.p))*.08,zc=.25+Math.random()*.5;
  ov.innerHTML='<div class="ovb" role="dialog" aria-label="จังหวะ"><div class="ovh"><b>จับจังหวะให้ดี!</b></div><p class="hint" style="margin:0 0 8px">กดหยุด (หรือกด Space) ให้ตัวชี้อยู่ในช่วงสีเขียว ยิ่งตรงความเสี่ยงยิ่งลด</p><div id="mgbar" style="position:relative;height:26px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;overflow:hidden"><div style="position:absolute;top:0;bottom:0;left:'+((zc-zw/2)*100)+'%;width:'+(zw*100)+'%;background:#3dd68c88"></div><div id="mgm" style="position:absolute;top:0;bottom:0;width:4px;background:var(--gold2);left:0"></div></div><div class="row" style="margin-top:12px"><button class="btn" id="mgstop">หยุด!</button><button class="btn ghost" id="mgskip">ปล่อยตามดวง</button></div><label class="hint" style="display:block;margin-top:8px"><input type="checkbox" id="mgoff"> ไม่ต้องเล่นมินิเกมนี้อีก</label></div>';
  document.body.appendChild(ov);
  let t0=performance.now(),fin=false,raf;
  const pos=t=>{const q=((t-t0)/1000*(1.1+c.risk.p))%2;return q<1?q:2-q};
  const m=ov.querySelector('#mgm');
  const loop=t=>{if(fin)return;m.style.left='calc('+(pos(t)*100)+'% - 2px)';raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop);
  const end=mult=>{if(fin)return;fin=true;cancelAnimationFrame(raf);document.removeEventListener('keydown',kd,true);try{if(ov.querySelector('#mgoff').checked)localStorage.setItem(MGK,'off')}catch(e){}ov.remove();done(mult)};
  const stop=()=>{const p=pos(performance.now()),d=Math.abs(p-zc);end(d<=zw/2?.5:d<=zw?.85:1.2)};
  const kd=e=>{if(e.code==='Space'||e.key===' '){e.preventDefault();e.stopPropagation();stop()}};
  document.addEventListener('keydown',kd,true);
  ov.querySelector('#mgstop').onclick=stop;ov.querySelector('#mgskip').onclick=()=>end(1);
  setTimeout(()=>end(1),6000);
}
function choose(i){
  if(busy||!ev||!ev.ch[i]||!ev.ch[i].ok)return;busy=true;
  panel.querySelectorAll('.ch').forEach(b=>b.disabled=true);
  const c0=ev.ch[i];
  if(c0.risk&&mgOn()&&!(MP.on&&MP.guest)&&hostIsLead()&&!c0.roll){mgPlay(c0,m=>{MGX=m;try{doChoose(i)}finally{MGX=1}});return}
  doChoose(i);
}
function doChoose(i){
  const dice=ev.ch[i].roll;
  const o=resolve(ev,i);
  sfx(dice?'dice':o.ok?'ok':'bad');
  {const ak=animKind(ev.ch[i]);let kind=ak.k;if(!o.ok&&ev.cat==='danger'&&['talk','love','fun','money','heal','rest','pray','run'].includes(kind))kind='scare';playAnim(kind,o.ok,ak)}
  if(!o.ok)view.flash=.35;
  if(o.arrest)view.flash=.8;
  if(o.near){view.flash=1;sfx('near');view.shake=1}
  if(o.crewNew)setTimeout(()=>sfx('crew'),500);
  setTimeout(()=>showOutcome(o),dice?1700:1400);
}

function outModel(o){
  const strip=t=>String(t).replace(/<[^>]+>/g,'');
  return {k:'out',choice:o.choice,ok:o.ok,text:o.text,extra:o.extra.map(strip),x:o.deltas,inv:o.inv||{},days:o.days,day0:o.day0,end:o.end||null,act:!!o.act,
    eat:o.eat||0,drink:o.drink||0,hunger:o.hunger||0,thirst:o.thirst||0,cost:o.cost||0,hud:hudOf(),mood:o.mood||S.mood};
}
function outHTML(m,mine){
  let extra='';for(const t of m.extra)extra+='<div class="amb">'+(mine?t:esc(t))+'</div>';
  const bits=[];
  if(m.cost)bits.push('<span class="chip dn txt">ค่าครองชีพ '+m.days+' วัน '+fmt(-m.cost)+'</span>');
  if(m.eat)bits.push('<span class="chip up txt">กินอาหาร '+m.eat+' มื้อ</span>');
  if(m.drink)bits.push('<span class="chip up txt">ดื่มน้ำ '+m.drink+' ครั้ง</span>');
  if(m.hunger)bits.push('<span class="chip dn txt">หิวจนแสบท้อง</span>');

   '<div class="chips">'+chipsFor(Object.assign({},m.x,m.inv))+'<span class="chip neu">'+ic('d')+m.days+' วัน</span>'+bits.join('')+'</div>';
}
function urgent(){return S.fd<45||S.wt<45||S.wd>0||S.inf>0||S.en<30}

function showOutcome(o){
  lastOut=o;

let MRES=null;
function morningModel(){
  const L=actionList();
  return {k:'morn',hud:hudOf(),mood:'calm',day:S.day,
    opts:L.map(a=>({t:a.t,d:a.d,en:a.en,ok:a.ok,why:a.why})),vote:{n:L.length+1,off:L.map((a,i)=>a.ok?-1:i).filter(i=>i>=0)},
    left:actLeft(),urgent:urgent(),res:MRES?{c:MRES.choice,t:MRES.text,ok:!!MRES.ok,x:MRES.deltas||{},inv:MRES.inv||{},d:MRES.days,ex:(MRES.extra||[]).map(s=>String(s).replace(/<[^>]+>/g,''))}:null,done:(actLeft()<=0&&!!S.restU),scene:'room',tod:ev?ev.tod:'day',look:S.role.look,doomId:S.doom.id,crew:S.crew.map(m=>({look:m.look})),seed:'morn'+Math.floor(S.day)};
}
function morningAdvice(h,opts){
  const ok=i=>opts[i]&&opts[i].ok,inv=h.inv||{};
  if((h.inf>0||h.wd>25)&&ok(5))return {i:5,t:'มีแผลหรือติดเชื้อ ควรรักษาก่อน'};
  if(h.wt<55&&!(inv.water>0)&&ok(1))return {i:1,t:'น้ำในคลังหมดแล้ว ควรออกไปหาน้ำ'};
  if(h.fd<55&&!(inv.food>0)&&ok(0))return {i:0,t:'อาหารในคลังหมดแล้ว ควรออกไปหาของกิน'};
  if(h.en<30&&ok(2))return {i:2,t:'แรงเหลือน้อย ควรพักผ่อน (ฟรี)'};
  if(h.sh&&h.sh.cond<35&&(inv.mat>0)&&ok(3))return {i:3,t:'ที่พักทรุดโทรม ควรซ่อม'};
  if((inv.food|0)<=1&&ok(0))return {i:0,t:'อาหารในคลังเหลือน้อย ควรหาไว้เพิ่ม'};
  if((inv.water|0)<=1&&ok(1))return {i:1,t:'น้ำในคลังเหลือน้อย ควรหาไว้เพิ่ม'};
  return {i:-1,t:'ตอนนี้ยังไม่มีเรื่องเร่งด่วน จะเตรียมของหรือไปต่อเหตุการณ์เลยก็ได้'};
}

  const st=[];
  if(h.wd>0)st.push('<span class="tag bad">แผล '+Math.round(h.wd)+'</span>');
  if(h.inf>0)st.push('<span class="tag bad">ติดเชื้อ '+Math.round(h.inf)+'</span>');
  if(h.fd<40)st.push('<span class="tag bad">หิว</span>');
  if(h.wt<40)st.push('<span class="tag bad">กระหาย</span>');
  if(h.en<30)st.push('<span class="tag bad">หมดแรง</span>');
  if(!st.length)st.push('<span class="tag">ร่างกายยังไหว</span>');
  return '<div class="kick"><span>ช่วงเช้า</span><span>วันที่ '+(Math.floor(m.day)+1)+'</span><span>แต่ละแผนใช้เวลา '+Math.max(1,Math.round(tfx()))+' วัน</span></div>'+
   '<h2 style="font-size:23px">วันนี้จะดูแลอะไรก่อน</h2>'+

function morningPick(i){

function gnum(v,a,b){v=+v;return isFinite(v)?clamp(v,a,b):0}
function sanHud(h){
  if(!h||typeof h!=='object')return null;
  const o={nm:clean(h.nm,24),rl:clean(h.rl,60),rn:clean(h.rn,40),age:gnum(h.age,0,150),doom:clean(h.doom,60),day:gnum(h.day,0,365),mo:gnum(h.mo,-1e12,1e12),save:gnum(h.save,0,9)};
  for(const k of ['hp','md','lv','ht','fd','wt','en','wd','inf'])o[k]=gnum(h[k],0,100);
  const s=h.sh||{};o.sh={n:clean(s.n,40),df:gnum(s.df,0,100),hd:gnum(s.hd,0,100),cond:gnum(s.cond,0,100)};
  o.up=Array.isArray(h.up)?h.up.filter(k=>UPGK.includes(k)).slice(0,10):[];
  o.inv={};for(const k of INVL)o.inv[k]=gnum(h.inv&&h.inv[k],0,999);
  o.gear=Array.isArray(h.gear)?h.gear.filter(k=>GEARK.includes(k)):[];
  o.crew=Array.isArray(h.crew)?h.crew.slice(0,6).map(n=>clean(n,28)):[];
  o.jr=Array.isArray(h.jr)?h.jr.slice(0,5).map(j=>({d:gnum(j&&j.d,0,999),t:clean(j&&j.t,80)})):[];
  return o;
}
function sanLook(l){
  const c=v=>/^#[0-9a-fA-F]{6}$/.test(v)?v:'#888888';
  if(!l||typeof l!=='object')return null;
  return {skin:c(l.skin),hair:c(l.hair),shirt:c(l.shirt),pants:c(l.pants),hat:l.hat&&/^#[0-9a-fA-F]{6}$/.test(l.hat)?l.hat:null};
}
function sanX(x){const o={};if(x&&typeof x==='object')for(const k of ALLK)if(x[k])o[k]=gnum(x[k],-1e12,1e12);return o}

function giftSend(to,k){
  if(!GIFTK.includes(k)||S.inv[k]<1||(S.giftOut|0)>=GIFT_LIFE)return;
  const now=Date.now();if(now-(giftLast[to]||0)<1500)return;giftLast[to]=now;
  if(!friendsOnline().some(p=>p.peer===to)){giftMsg='เพื่อนคนนั้นออกไปแล้ว';showGift();return}
  S.inv[k]--;S.giftOut=(S.giftOut|0)+1;
  S.md=clamp(S.md+2,0,100);S.c.help++;
  MP.api.emit('gift',{to,it:k,n:1}).then(()=>{
    giftMsg='ส่ง'+ITEM_NAME[k]+'ให้เพื่อนแล้ว';sfx('buy');saveGame(true);if(stage==='shop')showGift();
  }).catch(()=>{S.inv[k]++;S.giftOut--;S.md=clamp(S.md-2,0,100);S.c.help--;giftMsg='ส่งไม่สำเร็จ ลองใหม่อีกครั้ง';if(stage==='shop')showGift()});
}
let giftUnsub=null,giftRx={};
function giftInit(){
  if(giftUnsub||!MP.api||typeof MP.api.on!=='function')return;
  try{
    giftUnsub=MP.api.on('gift',m=>{
      if(!m||m.sameTab||m.isMe)return;
      const d=m.data;if(!d||typeof d!=='object')return;
      const me=myPeerId();if(!me||d.to!==me)return;
      const now=Date.now();if(now-(giftRx[m.peer]|0)<800)return;giftRx[m.peer]=now;
      const p=MP.api.peers().find(x=>x.peer===m.peer);
      const nm=clean(p&&p.presence&&p.presence.nm,16)||'เพื่อน';
      giftReceive(nm,String(d.it),+d.n||1);
    });
  }catch(e){}
}

function startRecap(E,kind,endCtx,endModelM){
  if(RC||!recapAvail())return;
  recapCss();
  const wrap=document.querySelector('.cwrap');if(!wrap)return;
  const reel=S.reel.slice(),n=reel.length;
  const dur=Math.max(1400,Math.min(2600,Math.round(90000/n)));
  const top=document.createElement('div');top.id='rtop';top.innerHTML='<b id="rday">วัน 1</b><div class="bar"><i id="rbar"></i></div><button class="mini" id="rskip">ข้ามไปตอนจบ ▶▶</button>';
  const cap=document.createElement('div');cap.id='rcap';
  wrap.classList.add('recap');wrap.appendChild(top);wrap.appendChild(cap);
  const hidden=[];['count','floaters'].forEach(id=>{const el=document.getElementById(id);if(el){hidden.push([el,el.style.display]);el.style.display='none'}});
  const tk={dead:false,t:0};RC=tk;
  try{window.scrollTo(0,0)}catch(e){}
  const mk=(r)=>{
    let mon=null;try{mon=typeof monOf==='function'?monOf(r.k,r.sc):null}catch(e){}
    return {scene:r.sc,tod:r.td,seed:r.id,rain:!!r.rn,npc:r.np,look:S.role.look,doomId:S.doom.id,day:r.d,crew:S.crew,mood:r.mo,ghost:r.k==='ghostf'||r.sc==='haunt',mon};
  };
  const setCap=(html)=>{cap.innerHTML='<div class="rcfade">'+html+'</div>'};
  const close=()=>{
    if(tk.dead)return;tk.dead=true;clearTimeout(tk.t);RC=null;
    wrap.classList.remove('recap');top.remove();cap.remove();hidden.forEach(h=>{h[0].style.display=h[1]});
    try{setView(endCtx);setMood(endModelM.mood)}catch(e){}
    try{view.day=endCtx.day}catch(e){}
    try{document.removeEventListener('keydown',onKey)}catch(e){}
  };
  const onKey=e=>{if(e.key==='Escape'||e.key==='Enter'||e.key===' '){e.preventDefault();close()}};
  document.addEventListener('keydown',onKey);
  top.querySelector('#rskip').onclick=close;
  const outro=()=>{
    if(tk.dead)return;
    try{setView(endCtx);setMood(endModelM.mood);view.flash=kind==='final'?1:0}catch(e){}
    document.getElementById('rbar').style.width='100%';document.getElementById('rday').textContent='จบ';
    setCap('<div class="d">'+esc(S.name)+' · '+esc(S.role.n)+'</div><div class="h">'+esc(E.title)+'</div><div class="c">'+esc(E.grade)+' · '+E.score+' / 100</div><div class="s">กำลังกลับไปหน้าสรุป…</div>');
    tk.t=setTimeout(close,4800);
  };
  const play=i=>{
    if(tk.dead)return;
    if(i>=n){outro();return}
    const r=reel[i];
    try{setView(mk(r));view.day=r.d;view.fade=1}catch(e){}
    document.getElementById('rday').textContent='วัน '+(r.d+1);
    document.getElementById('rbar').style.width=Math.min(100,Math.round(r.d/365*100))+'%';
    setCap('<div class="d">วันที่ '+(r.d+1)+' จาก 365</div><div class="h">'+esc(r.h)+'</div><div class="c '+(r.ok?'o':'f')+'">'+(r.ok?'✓ ':'✗ ')+'คุณเลือก: '+esc(r.c)+'</div><div class="s">❤ '+r.hp+' · 🙂 '+r.md+' · '+fmt(r.m)+'</div>');
    tk.t=setTimeout(()=>play(i+1),dur);
  };
  try{setView(mk(reel[0]));view.day=reel[0].d}catch(e){}
  setCap('<div class="d">365 วันที่ผ่านมา</div><div class="h">'+esc(S.name)+' · '+esc(S.role.n)+'</div><div class="c">ทุกการตัดสินใจ ตั้งแต่วันแรกจนวันสุดท้าย</div>');
  tk.t=setTimeout(()=>play(0),2400);
}
/* ===== การ์ดแชร์ผลลัพธ์เป็นภาพ (PNG 1080x1350) ===== */
function cardWrap(x,text,maxW,font){
  x.font=font;const lines=[];let cur='';
  for(const ch of Array.from(String(text||''))){
    if(ch==='\n'){lines.push(cur);cur='';continue}
    if(x.measureText(cur+ch).width>maxW&&cur){lines.push(cur);cur=ch}else cur+=ch;
  }
  if(cur)lines.push(cur);return lines;
}
function cardRound(x,px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath()}
async function makeShareCard(E,kind){
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');

  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,th.a);g.addColorStop(1,th.b);x.fillStyle=g;x.fillRect(0,0,W,H);

  x.restore();

  const sy=y+20;
  x.fillStyle='rgba(255,255,255,.07)';cardRound(x,60,sy,960,170,24);x.fill();
  x.fillStyle=th.ac;x.font='800 112px '+F;x.fillText(String(E.score),90,sy+128);
  const sw=x.measureText(String(E.score)).width;
  x.fillStyle='rgba(255,255,255,.6)';x.font='600 36px '+F;x.fillText('/ 100',90+sw+10,sy+128);
  x.fillStyle='#fff';x.font='700 38px '+F;
  const gl=cardWrap(x,E.grade,420,'700 38px '+F);gl.slice(0,2).forEach((l,i)=>x.fillText(l,600,sy+70+i*48));
  // สถิติเด่น
  const kt=(typeof karTitle==='function')?karTitle(S.kar|0)[1]:'';
  const chips=[
   ['วันที่รอด',Math.min(365,Math.floor(S.day))+' วัน'],
   ['เฉียดตาย',S.c.near+' ครั้ง'],
   ['ช่วยเหลือ',S.c.help+' ครั้ง'],
   ['ชื่อเสียง',kt||'-']
  ];
  if(S.gang)chips[3]=['แก๊ง/กลุ่ม','“'+S.gang.n+'”'];
  const cy=sy+200,cw=225,gap=20;

   const cx=60+i*(cw+gap);x.fillStyle='rgba(255,255,255,.07)';cardRound(x,cx,cy,cw,110,18);x.fill();
   x.fillStyle='rgba(255,255,255,.6)';x.font='500 22px '+F;x.fillText(ch[0],cx+16,cy+34);
   x.fillStyle='#fff';x.font='700 28px '+F;
   const ls=cardWrap(x,ch[1],cw-28,'700 28px '+F);x.font='700 28px '+F;ls.slice(0,2).forEach((l,j)=>x.fillText(l,cx+16,cy+70+j*30));
  });
  // คำสุดท้าย
  const ep=E.letter&&E.letter.txt?('จดหมายถึง '+E.letter.to+': '+E.letter.txt):E.epitaph;
  x.fillStyle='rgba(255,255,255,.8)';x.font='italic 500 28px '+F;
  const el=cardWrap(x,(E.cause?'สาเหตุ: '+E.cause.t+'\n':'')+String(ep||'').replace(/[“”"]/g,''),960,'italic 500 28px '+F);
  let ey=cy+160;{const sl=el.slice(0,3);if(el.length>3)sl[2]=sl[2].slice(0,-1)+'…';sl.forEach(l=>{x.fillText(l,60,ey);ey+=38})}
  x.fillStyle='rgba(255,255,255,.45)';x.font='500 24px '+F;x.textAlign='right';
  x.fillText('bassuto.github.io/doom365',W-60,H-42);
  return c;
}
async function saveShareCard(E,kind){
  try{
    const c=await makeShareCard(E,kind);
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    if(!blob){toast('สร้างการ์ดไม่สำเร็จ');return}
    const file=new File([blob],'doom365-card.png',{type:'image/png'});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'ถ้าโลกแตกอีก 365 วัน',text:S.name+' จบแบบ “'+E.title+'” ได้ '+E.score+'/100'});return}
    }catch(e){if(e&&e.name==='AbortError')return}
    let done=false;
    try{const d=await claude.use('downloads');if(d){await d.save({filename:'doom365-card.png',data:blob});done=true}}catch(e){}
    if(!done){const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='doom365-card.png';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
    toast('บันทึกการ์ดแล้ว');
  }catch(e){toast('สร้างการ์ดไม่สำเร็จ')}
}

function letterTargets(){
  const a=[];
  if(S.flags.lover)a.push({k:'love',t:'คนรัก'});
  for(const m of S.crew.slice(0,3))a.push({k:'friend',t:m.n});
  a.push({k:'fam',t:'ครอบครัว'});
  if(!a.some(x=>x.k==='friend'))a.push({k:'friend',t:'เพื่อนเก่า'});
  if((S.kar|0)<=-10||S.c.steal>=3||S.rival)a.push({k:'foe',t:'คนที่เคยมีเรื่องกัน'});
  a.push({k:'self',t:'ตัวฉันเอง'});a.push({k:'all',t:'ทุกคน'});
  return a;
}
